<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Classification périodique simplifiée</title>
<desc id="desc">Classification périodique simplifiée des quatre premières périodes avec plusieurs éléments repères et certaines cases laissées vides.</desc>
<style>
  .cell { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
  .sym { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
  .period { font: 500 12px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
  .caption { font: 600 18px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
  .sub { font: 400 13px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
</style>
<rect width="960" height="390" fill="white"/>
<text x="30" y="34" class="caption">Classification périodique simplifiée</text>
<text x="30" y="55" class="sub">Les quatre premières périodes avec symboles repères et cases laissées vides.</text>

<!-- Période 1 -->
<text x="8" y="109" class="period">P1</text>
<rect class="cell" x="30" y="82" width="44" height="44" rx="5"/>
<text class="sym" x="52" y="105">H</text>
<rect class="cell" x="880" y="82" width="44" height="44" rx="5"/>
<text class="sym" x="902" y="105">He</text>

