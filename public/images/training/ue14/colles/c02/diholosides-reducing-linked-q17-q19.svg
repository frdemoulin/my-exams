<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 14px; }
      .card-header { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .residue-label { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .sub-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #64748b; text-anchor: middle; }
      .ring-line { stroke: #1e293b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wedge-line { fill: #1e293b; stroke: #1e293b; stroke-width: 1; }
      .dashed-line { stroke: #1e293b; stroke-width: 2.5; stroke-dasharray: 4,4; stroke-linecap: round; }
      .atom-text { font-family: 'Courier New', Courier, monospace, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .atom-o { font-family: 'Courier New', Courier, monospace, sans-serif; font-size: 22px; font-weight: 800; fill: #dc2626; text-anchor: middle; }
      .oh-text { font-family: 'Courier New', Courier, monospace, sans-serif; font-size: 18px; font-weight: 700; fill: #2563eb; text-anchor: middle; }
      .target-carbon { fill: #0f172a; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="650" rx="16" />

  <!-- ==================== LACTOSE (GAUCHE) ==================== -->
  <g transform="translate(40, 40)">
    <rect class="card" width="540" height="570" />
    <text x="270" y="45" class="card-header">Lactose</text>
    <text x="270" y="72" class="sub-title">β-D-galactopyranosyl-(1→4)-D-glucopyranose</text>

    <!-- 1. GALACTOSE RING (Pyranose à gauche) -->
    <!-- Center of Gal ring ~ (150, 280) -->
    <g transform="translate(30, 60)">
      <!-- Ring Haworth Hexagon -->
      <!-- Vertices: O(140,180), C1(200,240), C2(160,320), C3(80,320), C4(40,240), C5(80,180) -->
      <polygon points="140,180 200,240 160,320 80,320 40,240 80,180" class="ring-line" />
      <!-- Oxygen at (140, 180) -->
      <circle cx="140" cy="180" r="16" fill="#f8fafc" />
      <text x="140" y="187" class="atom-o">O</text>

      <!-- Substituents Galactose -->
      <!-- C6-CH2OH at C5 (80,180) -->
      <line x1="80" y1="180" x2="80" y2="120" class="ring-line" />
      <text x="80" y="110" class="atom-text">CH₂OH</text>
      <!-- C4 OH (axial up in Gal) at C4 (40,240) -->
      <line x1="40" y1="240" x2="40" y2="185" class="ring-line" />
      <text x="40" y="175" class="oh-text">OH</text>
      <!-- C3 OH (equatorial down) at C3 (80,320) -->
      <line x1="80" y1="320" x2="80" y2="365" class="ring-line" />
      <text x="80" y="385" class="oh-text">OH</text>
      <!-- C2 OH (equatorial down) at C2 (160,320) -->
      <line x1="160" y1="320" x2="160" y2="365" class="ring-line" />
      <text x="160" y="385" class="oh-text">OH</text>

      <!-- Galactose label -->
      <text x="120" y="440" class="residue-label">Galactose</text>
    </g>

    <!-- 2. LIAISON OSIDIQUE β(1→4) -->
    <!-- Connects C1 of Gal (230, 300) to C4 of Glucose (320, 300) via Oxygen -->
    <path d="M 230 300 L 270 270 L 310 270 L 330 300" class="ring-line" />
    <circle cx="270" cy="270" r="14" fill="#f8fafc" />
    <text x="270" y="276" class="atom-o">O</text>

    <!-- 3. GLUCOSE RING (Pyranose à droite) -->
    <!-- Center of Glu ring ~ (410, 280) -->
    <g transform="translate(290, 60)">
      <!-- Ring Haworth Hexagon -->
      <!-- Vertices: O(140,180), C1(200,240), C2(160,320), C3(80,320), C4(40,240), C5(80,180) -->
      <polygon points="140,180 200,240 160,320 80,320 40,240 80,180" class="ring-line" />
      <!-- Oxygen at (140, 180) -->
      <circle cx="140" cy="180" r="16" fill="#f8fafc" />
      <text x="140" y="187" class="atom-o">O</text>

      <!-- Substituents Glucose -->
      <!-- C6-CH2OH at C5 (80,180) -->
      <line x1="80" y1="180" x2="80" y2="120" class="ring-line" />
      <text x="80" y="110" class="atom-text">CH₂OH</text>

      <!-- C3 OH (equatorial up) at C3 (80,320) -->
      <line x1="80" y1="320" x2="80" y2="365" class="ring-line" />
      <text x="80" y="385" class="oh-text">OH</text>
      <!-- C2 OH (equatorial down) at C2 (160,320) -->
      <line x1="160" y1="320" x2="160" y2="365" class="ring-line" />
      <text x="160" y="385" class="oh-text">OH</text>

      <!-- C1 ANOMERIC CARBON (LIBRE) AT (200, 240) -->
      <!-- Highlighted Carbon Dot -->
      <circle cx="200" cy="240" r="7" class="target-carbon" />
      <!-- Free OH group on C1 (equatorial/axial equilibrium indicated by OH line) -->
      <line x1="200" y1="240" x2="240" y2="280" class="ring-line" stroke="#2563eb" stroke-width="3" />
      <text x="255" y="295" class="oh-text" style="fill: #2563eb; font-size: 22px;">OH</text>

      <!-- Glucose label -->
      <text x="120" y="440" class="residue-label">Glucose</text>
    </g>
  </g>

  <!-- ==================== SACCHAROSE (DROITE) ==================== -->
  <g transform="translate(620, 40)">
    <rect class="card" width="540" height="570" />
    <text x="270" y="45" class="card-header">Saccharose</text>
    <text x="270" y="72" class="sub-title">α-D-glucopyranosyl-(1↔2)-β-D-fructofuranoside</text>

    <!-- 1. GLUCOSE RING (Pyranose à gauche du saccharose) -->
    <g transform="translate(30, 60)">
      <polygon points="140,180 200,240 160,320 80,320 40,240 80,180" class="ring-line" />
      <circle cx="140" cy="180" r="16" fill="#f8fafc" />
      <text x="140" y="187" class="atom-o">O</text>

      <line x1="80" y1="180" x2="80" y2="120" class="ring-line" />
      <text x="80" y="110" class="atom-text">CH₂OH</text>
      <line x1="40" y1="240" x2="40" y2="285" class="ring-line" />
      <text x="40" y="305" class="oh-text">OH</text>
      <line x1="80" y1="320" x2="80" y2="365" class="ring-line" />
      <text x="80" y="385" class="oh-text">OH</text>
      <line x1="160" y1="320" x2="160" y2="365" class="ring-line" />
      <text x="160" y="385" class="oh-text">OH</text>

      <text x="120" y="440" class="residue-label">Glucose</text>
    </g>

    <!-- 2. LIAISON OSIDIQUE DICARBONYLÉE α1↔β2 -->
    <!-- Connects Glucose C1 (230, 300) to Fructose C2 (340, 270) -->
    <path d="M 230 300 L 270 320 L 310 320 L 340 270" class="ring-line" />
    <circle cx="270" cy="320" r="14" fill="#f8fafc" />
    <text x="270" y="326" class="atom-o">O</text>

    <!-- 3. FRUCTOSE RING (Furanose à droite du saccharose - 5-membered ring) -->
    <g transform="translate(300, 60)">
      <!-- Vertices: O(100,170), C2(40,210), C3(60,290), C4(140,290), C5(160,210) -->
      <polygon points="100,170 40,210 60,290 140,290 160,210" class="ring-line" />
      <circle cx="100" cy="170" r="16" fill="#f8fafc" />
      <text x="100" y="177" class="atom-o">O</text>

      <!-- Fructose substituents -->
      <!-- C1-CH2OH at C2 (40,210) -->
      <line x1="40" y1="210" x2="15" y2="160" class="ring-line" />
      <text x="10" y="150" class="atom-text">CH₂OH</text>

      <!-- C6-CH2OH at C5 (160,210) -->
      <line x1="160" y1="210" x2="185" y2="160" class="ring-line" />
      <text x="190" y="150" class="atom-text">CH₂OH</text>

      <!-- OH at C3 (60,290) -->
      <line x1="60" y1="290" x2="60" y2="335" class="ring-line" />
      <text x="60" y="355" class="oh-text">OH</text>
      <!-- OH at C4 (140,290) -->
      <line x1="140" y1="290" x2="140" y2="335" class="ring-line" />
      <text x="140" y="355" class="oh-text">OH</text>

      <text x="100" y="440" class="residue-label">Fructose</text>
    </g>
  </g>
</svg>
