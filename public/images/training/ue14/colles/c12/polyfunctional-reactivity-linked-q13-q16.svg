<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="panelAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="panelBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bgGrad)" rx="16"/>

  <!-- Title Banner -->
  <rect x="30" y="18" width="1140" height="44" rx="8" fill="#e2e8f0" opacity="0.8"/>
  <text x="600" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Molécule polyfonctionnelle et transformations de fonctions oxygénées
  </text>

  <!-- ==================== PANNEAU A : MOLÉCULE M (GAUCHE) ==================== -->
  <g filter="url(#shadow)" transform="translate(30, 80)">
    <rect width="540" height="655" rx="12" fill="url(#panelAGrad)" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Badge Panneau A -->
    <rect x="25" y="20" width="160" height="30" rx="6" fill="#2563eb"/>
    <text x="105" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      Molécule M
    </text>

    <!-- Chemical Structure of M -->
    <!-- HOOC - CH2 - C(=O) - CH(NH2) - CH3 -->
    <g transform="translate(40, 120)">
      
      <!-- Carboxylic Acid Group (HO-C(=O)-) -->
      <!-- Hydroxyl HO (x=0, y=310) -> canvas (70, 510) -->
      <!-- Carboxylic Carbon C (x=60, y=280) -> canvas (130, 480) -->
      <!-- Carboxylic Oxygen =O (x=60, y=200) -> canvas (130, 400) -->

      <!-- Ketone Carbon C (x=250, y=280) -> canvas (320, 480) -->
      <!-- TARGET Q16: Ketone Carbonyl Oxygen =O (x=250, y=170) -> canvas (320, 370) -> wait let's calculate relative:
           Panneau A is at X=30, Y=80.
           Inside Panneau A, if Ketone Oxygen is at x=290, y=170 -> canvas absolute (320, 250).
      -->

      <!-- Let's draw clear chemical formula with SVG lines & text -->

      <!-- Backbone bonds -->
      <line x1="60" y1="280" x2="160" y2="280" stroke="#0f172a" stroke-width="3"/>
      <line x1="160" y1="280" x2="250" y2="280" stroke="#0f172a" stroke-width="3"/>
      <line x1="250" y1="280" x2="340" y2="280" stroke="#0f172a" stroke-width="3"/>
      <line x1="340" y1="280" x2="430" y2="280" stroke="#0f172a" stroke-width="3"/>

      <!-- HO-C bond -->
      <line x1="10" y1="280" x2="60" y2="280" stroke="#0f172a" stroke-width="3"/>

      <!-- Carboxylic C=O double bond -->
      <line x1="55" y1="280" x2="55" y2="200" stroke="#dc2626" stroke-width="3"/>
      <line x1="65" y1="280" x2="65" y2="200" stroke="#dc2626" stroke-width="3"/>

      <!-- Ketone C=O double bond -->
      <line x1="245" y1="280" x2="245" y2="170" stroke="#dc2626" stroke-width="3"/>
      <line x1="255" y1="280" x2="255" y2="170" stroke="#dc2626" stroke-width="3"/>

      <!-- C-NH2 bond -->
      <line x1="340" y1="280" x2="340" y2="360" stroke="#2563eb" stroke-width="3"/>

      <!-- Atom Texts -->
      <!-- HO -->
      <text x="-25" y="288" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="800" fill="#dc2626">HO</text>
      
      <!-- Carboxylic C (carbon 1) -->
      <text x="60" y="288" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="800" fill="#0f172a">C</text>
      <!-- Carboxylic =O oxygen -->
      <circle cx="60" cy="180" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <text x="60" y="188" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="800" fill="#dc2626">O</text>

      <!-- CH2 (carbon 2) -->
      <text x="160" y="288" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="800" fill="#0f172a">CH<tspan font-size="16" dy="4">2</tspan></text>

      <!-- Ketone C (carbon 3) -->
      <text x="250" y="288" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="800" fill="#0f172a">C</text>
      <!-- Ketone =O oxygen (TARGET Q16: Absolute canvas X=30+40+250=320, Y=80+120+150=250) -->
      <circle cx="250" cy="150" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <text x="250" y="158" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="800" fill="#dc2626">O</text>

      <!-- CH (carbon 4) -->
      <text x="340" y="288" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="800" fill="#0f172a">CH</text>
      <!-- NH2 amine nitrogen -->
      <circle cx="340" cy="390" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <text x="340" y="398" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="800" fill="#1d4ed8">NH<tspan font-size="16" dy="4">2</tspan></text>

      <!-- CH3 (carbon 5) -->
      <text x="430" y="288" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="800" fill="#0f172a">CH<tspan font-size="16" dy="4">3</tspan></text>

      <!-- Structural Legend -->
      <rect x="20" y="450" width="420" height="40" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="230" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
        Squelette polyfonctionnel à 5 carbones
      </text>
    </g>
  </g>

  <!-- ==================== PANNEAU B : TRANSFORMATIONS (DROITE) ==================== -->
  <g filter="url(#shadow)" transform="translate(590, 80)">
    <rect width="580" height="655" rx="12" fill="url(#panelBGrad)" stroke="#059669" stroke-width="2"/>
    
    <!-- Badge Panneau B -->
    <rect x="25" y="20" width="160" height="30" rx="6" fill="#059669"/>
    <text x="105" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      Panneau B
    </text>

    <!-- Transformations List -->
    <g transform="translate(30, 90)" font-family="'Courier New', Courier, monospace" font-size="17" font-weight="700" fill="#0f172a">
      
      <!-- Transformation 1 -->
      <g transform="translate(0, 20)">
        <rect x="0" y="-15" width="520" height="95" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
        <text x="15" y="15" fill="#047857" font-family="system-ui, sans-serif" font-size="16" font-weight="800">1.</text>
        <text x="45" y="32">CH<tspan font-size="13" dy="3">3</tspan><tspan font-size="17" dy="-3">–CH<tspan font-size="13" dy="3">2</tspan><tspan font-size="17" dy="-3">–CH<tspan font-size="13" dy="3">2</tspan><tspan font-size="17" dy="-3">OH</tspan></text>
        <line x1="250" y1="26" x2="310" y2="26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowHead)"/>
        <text x="330" y="32">CH<tspan font-size="13" dy="3">3</tspan><tspan font-size="17" dy="-3">–CH<tspan font-size="13" dy="3">2</tspan><tspan font-size="17" dy="-3">–CHO</tspan></text>
      </g>

      <!-- Transformation 2 -->
      <g transform="translate(0, 150)">
        <rect x="0" y="-15" width="520" height="105" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
        <text x="15" y="15" fill="#047857" font-family="system-ui, sans-serif" font-size="16" font-weight="800">2.</text>
        <text x="45" y="42">CH<tspan font-size="13" dy="3">3</tspan><tspan font-size="17" dy="-3">–CH<tspan font-size="13" dy="3">2</tspan><tspan font-size="17" dy="-3">–CHO</tspan></text>
        
        <!-- Arrow NaBH4 then H3O+ -->
        <g transform="translate(225, 36)">
          <line x1="0" y1="0" x2="70" y2="0" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowHead)"/>
          <text x="35" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0284c7">1. NaBH<tspan font-size="9" dy="2">4</tspan></text>
          <text x="35" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0284c7">2. H<tspan font-size="9" dy="2">3</tspan>O<tspan font-size="9" dy="-2">+</tspan></text>
        </g>

        <text x="315" y="42">CH<tspan font-size="13" dy="3">3</tspan><tspan font-size="17" dy="-3">–CH<tspan font-size="13" dy="3">2</tspan><tspan font-size="17" dy="-3">–CH<tspan font-size="13" dy="3">2</tspan><tspan font-size="17" dy="-3">OH</tspan></text>
      </g>

      <!-- Transformation 3 -->
      <g transform="translate(0, 285)">
        <rect x="0" y="-15" width="520" height="95" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
        <text x="15" y="15" fill="#047857" font-family="system-ui, sans-serif" font-size="16" font-weight="800">3.</text>
        <text x="45" y="32">CH<tspan font-size="13" dy="3">3</tspan><tspan font-size="17" dy="-3">–CH<tspan font-size="13" dy="3">2</tspan><tspan font-size="17" dy="-3">–CHO</tspan></text>
        <line x1="240" y1="26" x2="310" y2="26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowHead)"/>
        <text x="330" y="32">CH<tspan font-size="13" dy="3">3</tspan><tspan font-size="17" dy="-3">–CH<tspan font-size="13" dy="3">2</tspan><tspan font-size="17" dy="-3">–COOH</tspan></text>
      </g>

      <!-- Transformation 4 -->
      <g transform="translate(0, 415)">
        <rect x="0" y="-15" width="520" height="105" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
        <text x="15" y="15" fill="#047857" font-family="system-ui, sans-serif" font-size="16" font-weight="800">4.</text>
        <text x="45" y="42">CH<tspan font-size="13" dy="3">3</tspan><tspan font-size="17" dy="-3">–C(=O)–CH<tspan font-size="13" dy="3">3</tspan></text>
        
        <!-- Arrow NaBH4 then H3O+ -->
        <g transform="translate(235, 36)">
          <line x1="0" y1="0" x2="70" y2="0" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowHead)"/>
          <text x="35" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0284c7">1. NaBH<tspan font-size="9" dy="2">4</tspan></text>
          <text x="35" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0284c7">2. H<tspan font-size="9" dy="2">3</tspan>O<tspan font-size="9" dy="-2">+</tspan></text>
        </g>

        <text x="325" y="42">CH<tspan font-size="13" dy="3">3</tspan><tspan font-size="17" dy="-3">–CH(OH)–CH<tspan font-size="13" dy="3">3</tspan></text>
      </g>

    </g>
  </g>
</svg>
