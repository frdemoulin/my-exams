<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 14px; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #1e293b; text-anchor: start; }
      .sn-label { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #2563eb; }
      .chem-text { font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .chem-bond { stroke: #0f172a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .chain-line { stroke: #475569; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .x-group { fill: #dc2626; font-size: 24px; font-weight: 800; font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="700" rx="16" />

  <!-- ==================== MOLÉCULE A (GLYCÉROPHOSPHOLIPIDE) ==================== -->
  <g transform="translate(40, 30)">
    <rect class="card" width="540" height="640" />
    <text x="30" y="45" class="label-text">Molécule A</text>

    <!-- Squelette Glycérol central avec repères sn-1, sn-2, sn-3 -->
    <g transform="translate(180, 140)">
      <!-- sn-1 -->
      <text x="-75" y="25" class="sn-label">sn-1</text>
      <text x="0" y="25" class="chem-text">CH<tspan font-size="14" dy="3">2</tspan><tspan font-size="20" dy="-3">—O</tspan></text>
      <!-- Liaison ester et chaîne acyle sn-1 -->
      <path class="chem-bond" d="M 75 18 L 110 18 L 125 0" />
      <text x="125" y="-5" class="chem-text" font-size="17">C=O</text>
      <line x1="135" y1="-22" x2="135" y2="-5" class="chem-bond" />
      <path class="chain-line" d="M 155 18 L 180 0 L 205 18 L 230 0 L 255 18 L 280 0 L 305 18" />

      <!-- Liaison verticale glycérol sn1-sn2 -->
      <line x1="20" y1="35" x2="20" y2="130" class="chem-bond" />

      <!-- sn-2 -->
      <text x="-75" y="155" class="sn-label">sn-2</text>
      <text x="0" y="155" class="chem-text">CH—O</text>
      <!-- Liaison ester et chaîne acyle sn-2 -->
      <path class="chem-bond" d="M 65 148 L 110 148" />
      <text x="125" y="125" class="chem-text" font-size="17">C=O</text>
      <line x1="135" y1="108" x2="135" y2="125" class="chem-bond" />
      <path class="chain-line" d="M 155 148 L 180 130 L 205 148 L 230 130 L 255 148 L 280 130 L 305 148" />

      <!-- Liaison verticale glycérol sn2-sn3 -->
      <line x1="20" y1="165" x2="20" y2="260" class="chem-bond" />

      <!-- sn-3 -->
      <text x="-75" y="285" class="sn-label">sn-3</text>
      <text x="0" y="285" class="chem-text">CH<tspan font-size="14" dy="3">2</tspan><tspan font-size="20" dy="-3">—O</tspan></text>

      <!-- Groupement Phosphate lié à sn-3 -->
      <line x1="75" y1="278" x2="110" y2="278" class="chem-bond" />
      
      <!-- P=O et P-O- -->
      <g transform="translate(110, 278)">
        <circle cx="20" cy="0" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
        <text x="12" y="7" class="chem-text" fill="#2563eb">P</text>

        <!-- Liaison vers X (tête polaire) -->
        <line x1="42" y1="0" x2="90" y2="0" class="chem-bond" />
        <text x="100" y="8" class="x-group">X</text>
      </g>
    </g>
  </g>

  <!-- ==================== MOLÉCULE B (TRIACYLGLYCÉROL) ==================== -->
  <g transform="translate(620, 30)">
    <rect class="card" width="540" height="640" />
    <text x="30" y="45" class="label-text">Molécule B</text>

    <!-- Squelette Glycérol avec 3 acides gras estérifiés -->
    <g transform="translate(140, 140)">
      <!-- Position 1 -->
      <text x="0" y="25" class="chem-text">CH<tspan font-size="14" dy="3">2</tspan><tspan font-size="20" dy="-3">—O</tspan></text>
      <path class="chem-bond" d="M 75 18 L 110 18" />
      <text x="125" y="-5" class="chem-text" font-size="17">C=O</text>
      <line x1="135" y1="-22" x2="135" y2="-5" class="chem-bond" />
      <path class="chain-line" d="M 155 18 L 180 0 L 205 18 L 230 0 L 255 18 L 280 0 L 305 18" />

      <!-- Liaison C1-C2 -->
      <line x1="20" y1="35" x2="20" y2="130" class="chem-bond" />

      <!-- Position 2 -->
      <text x="0" y="155" class="chem-text">CH—O</text>
      <path class="chem-bond" d="M 65 148 L 110 148" />
      <text x="125" y="125" class="chem-text" font-size="17">C=O</text>
      <line x1="135" y1="108" x2="135" y2="125" class="chem-bond" />
      <path class="chain-line" d="M 155 148 L 180 130 L 205 148 L 230 130 L 255 148 L 280 130 L 305 148" />

      <!-- Liaison C2-C3 -->
      <line x1="20" y1="165" x2="20" y2="260" class="chem-bond" />

      <!-- Position 3 -->
      <text x="0" y="285" class="chem-text">CH<tspan font-size="14" dy="3">2</tspan><tspan font-size="20" dy="-3">—O</tspan></text>
      <path class="chem-bond" d="M 75 278 L 110 278" />
      <text x="125" y="255" class="chem-text" font-size="17">C=O</text>
      <line x1="135" y1="238" x2="135" y2="255" class="chem-bond" />
      <path class="chain-line" d="M 155 278 L 180 260 L 205 278 L 230 260 L 255 278 L 280 260 L 305 278" />
    </g>
  </g>
</svg>

