<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="panelIGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="panelIIGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="panelIIIGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <marker id="arrowReact" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bgGrad)" rx="16"/>

  <!-- Title Banner -->
  <rect x="30" y="18" width="1140" height="44" rx="8" fill="#e2e8f0" opacity="0.8"/>
  <text x="600" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Oxydoréductions, additions organomagnésiennes et structure stéréochimique 3D
  </text>

  <!-- ==================== PANNEAU I : A, B, C (HAUT GAUCHE) ==================== -->
  <g filter="url(#shadow)" transform="translate(30, 80)">
    <rect width="730" height="310" rx="12" fill="url(#panelIGrad)" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Badge Panneau I -->
    <rect x="25" y="20" width="160" height="30" rx="6" fill="#2563eb"/>
    <text x="105" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      Panneau I
    </text>

    <!-- Formula A, B, C & Arrows -->
    <g font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#0f172a">
      
      <!-- Molecule A: CH3-CH2-CH2OH at X = 130, Y = 160 -->
      <g transform="translate(130, 160)">
        <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#2563eb">Composé A</text>
        <text x="0" y="40" text-anchor="middle">CH<tspan font-size="16" dy="4">3</tspan><tspan font-size="22" dy="-4">–CH</tspan><tspan font-size="16" dy="4">2</tspan><tspan font-size="22" dy="-4">–CH</tspan><tspan font-size="16" dy="4">2</tspan><tspan font-size="22" dy="-4">OH</tspan></text>
      </g>

      <!-- Arrow A -> B (Oxydation ménagée) -->
      <path d="M 230 195 L 340 195" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowReact)"/>
      <text x="285" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Oxydation</text>
      <text x="285" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">ménagée</text>

      <!-- Molecule B: CH3-CH2-CHO at X = 440, Y = 160 -->
      <g transform="translate(440, 160)">
        <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#2563eb">Composé B</text>
        <text x="0" y="40" text-anchor="middle">CH<tspan font-size="16" dy="4">3</tspan><tspan font-size="22" dy="-4">–CH</tspan><tspan font-size="16" dy="4">2</tspan><tspan font-size="22" dy="-4">–CHO</tspan></text>
      </g>

      <!-- Arrow B -> A (NaBH4 puis H3O+) -->
      <path d="M 340 220 L 230 220" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowReact)"/>
      <text x="285" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">1. NaBH<tspan font-size="9" dy="2">4</tspan><tspan font-size="11" dy="-2"> / 2. H</tspan><tspan font-size="9" dy="2">3</tspan><tspan font-size="11" dy="-2">O</tspan><tspan font-size="9" dy="-4">+</tspan></text>

      <!-- Arrow B -> C (Oxydation) -->
      <path d="M 520 195 L 605 195" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowReact)"/>
      <text x="562" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Oxydation</text>

      <!-- Molecule C: CH3-CH2-COOH at X = 665, Y = 160 -->
      <g transform="translate(665, 160)">
        <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#2563eb">Composé C</text>
        <text x="0" y="40" text-anchor="middle">CH<tspan font-size="16" dy="4">3</tspan><tspan font-size="22" dy="-4">–CH</tspan><tspan font-size="16" dy="4">2</tspan><tspan font-size="22" dy="-4">–COOH</tspan></text>
      </g>
    </g>
  </g>

  <!-- ==================== PANNEAU II : D -> PRODUIT E (BAS GAUCHE) ==================== -->
  <g filter="url(#shadow)" transform="translate(30, 410)">
    <rect width="730" height="325" rx="12" fill="url(#panelIIGrad)" stroke="#059669" stroke-width="2"/>
    
    <!-- Badge Panneau II -->
    <rect x="25" y="20" width="160" height="30" rx="6" fill="#059669"/>
    <text x="105" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      Panneau II
    </text>

    <!-- Formula D -> Arrow -> Produit E -->
    <g transform="translate(200, 160)" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#0f172a">
      <!-- Cétone D: CH3-C(=O)-CH3 -->
      <g transform="translate(0, 0)">
        <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#059669">Cétone D</text>
        <text x="-70" y="40" text-anchor="middle">CH<tspan font-size="17" dy="4">3</tspan></text>
        <line x1="-35" y1="32" x2="5" y2="32" stroke="#0f172a" stroke-width="2.5"/>
        <text x="25" y="40" text-anchor="middle">C</text>
        <line x1="25" y1="18" x2="25" y2="-15" stroke="#0f172a" stroke-dasharray="0" stroke-width="2.5"/>
        <line x1="17" y1="18" x2="17" y2="-15" stroke="#0f172a" stroke-dasharray="0" stroke-width="2.5"/>
        <text x="21" y="-25" text-anchor="middle" fill="#dc2626">O</text>
        <line x1="45" y1="32" x2="85" y2="32" stroke="#0f172a" stroke-width="2.5"/>
        <text x="120" y="40" text-anchor="middle">CH<tspan font-size="17" dy="4">3</tspan></text>
      </g>

      <!-- Arrow with reagent 1. CH3MgBr / 2. H3O+ -->
      <path d="M 180 32 L 340 32" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowReact)"/>
      <text x="260" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857">1. CH<tspan font-size="10" dy="3">3</tspan><tspan font-size="13" dy="-3">MgBr</tspan></text>
      <text x="260" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857">2. H<tspan font-size="10" dy="3">3</tspan><tspan font-size="13" dy="-3">O</tspan><tspan font-size="10" dy="-5">+</tspan></text>

      <!-- Box for Unnamed Product E -->
      <g transform="translate(420, 32)">
        <rect x="-70" y="-45" width="140" height="90" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-dasharray="6,4" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#047857">
          Produit E
        </text>
      </g>
    </g>
  </g>

  <!-- ==================== PANNEAU III : MOLÉCULE F (DROITE) ==================== -->
  <g filter="url(#shadow)" transform="translate(785, 80)">
    <rect width="385" height="655" rx="12" fill="url(#panelIIIGrad)" stroke="#c026d3" stroke-width="2"/>
    
    <!-- Badge Molécule F -->
    <rect x="25" y="20" width="160" height="30" rx="6" fill="#c026d3"/>
    <text x="105" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      Molécule F
    </text>

    <!-- 3D Representation of Molécule F: HOOC - CH(OH) - CH2 - CH3 -->
    <g transform="translate(195, 330)" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#0f172a">
      
      <!-- TARGET Q24: Central Stereogenic Carbon C* at (195, 410) on canvas -->
      <!-- Top Substituent: COOH -->
      <line x1="0" y1="-20" x2="0" y2="-110" stroke="#0f172a" stroke-width="3"/>
      <text x="0" y="-125" text-anchor="middle" fill="#dc2626">COOH</text>

      <!-- Central Carbon Atom (C*) -->
      <circle cx="0" cy="0" r="18" fill="#e9d5ff" stroke="#a855f7" stroke-width="2.5"/>
      <text x="0" y="8" text-anchor="middle" fill="#7e22ce" font-size="24">C</text>

      <!-- Left Substituent: H (Dash Representation - Dashed Wedge) -->
      <line x1="-20" y1="10" x2="-100" y2="35" stroke="#0f172a" stroke-dasharray="4,4" stroke-width="4"/>
      <text x="-125" y="42" text-anchor="middle" fill="#64748b">H</text>

      <!-- Right Substituent: OH (Wedge Representation - Solid Triangle) -->
      <polygon points="15,10 105,45 100,25" fill="#0f172a"/>
      <text x="135" y="42" text-anchor="middle" fill="#dc2626">OH</text>

      <!-- Bottom Substituent: CH2-CH3 -->
      <line x1="0" y1="20" x2="0" y2="110" stroke="#0f172a" stroke-width="3"/>
      <text x="0" y="145" text-anchor="middle">CH<tspan font-size="18" dy="4">2</tspan><tspan font-size="26" dy="-4">CH</tspan><tspan font-size="18" dy="4">3</tspan></text>
    </g>
  </g>
</svg>

