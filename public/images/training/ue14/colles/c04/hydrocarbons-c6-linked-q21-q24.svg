<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 14px; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #1e293b; text-anchor: start; }
      .topo-line { stroke: #0f172a; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .topo-double { stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .topo-triple { stroke: #0f172a; stroke-width: 3.5; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="700" rx="16" />

  <!-- ==================== CADRAN A (HAUT GAUCHE) : n-hexane ==================== -->
  <g transform="translate(40, 30)">
    <rect class="card" width="540" height="300" />
    <text x="30" y="45" class="label-text">A</text>
    <!-- Topologie n-hexane : 6 carbones (5 segments) -->
    <!-- (150, 180) -> (210, 120) -> (270, 180) -> (330, 120) -> (390, 180) -> (450, 120) -->
    <path class="topo-line" d="M 150 180 L 210 120 L 270 180 L 330 120 L 390 180 L 450 120" />
  </g>

  <!-- ==================== CADRAN B (HAUT DROITE) : cyclohexane ==================== -->
  <g transform="translate(620, 30)">
    <rect class="card" width="540" height="300" />
    <text x="30" y="45" class="label-text">B</text>
    <!-- Topologie cyclohexane : Hexagone régulier centré à (270, 150) -->
    <polygon points="270,75 340,115 340,195 270,235 200,195 200,115" class="topo-line" />
  </g>

  <!-- ==================== CADRAN C (BAS GAUCHE) : hex-2-ène (CIBLE QZONE Q24) ==================== -->
  <g transform="translate(40, 360)">
    <rect class="card" width="540" height="300" />
    <text x="30" y="45" class="label-text">C</text>
    <!-- Topologie hex-2-ène : 6 carbones avec double liaison entre C2 et C3 -->
    <!-- C1(150, 180) -> C2(210, 120) -> C3(270, 180) -> C4(330, 120) -> C5(390, 180) -> C6(450, 120) -->
    <!-- Liaison simple C1-C2 -->
    <line x1="150" y1="180" x2="210" y2="120" class="topo-line" />
    
    <!-- DOUBLE LIAISON C2=C3 (CIBLE QZONE) -->
    <g id="target-double-bond">
      <line x1="210" y1="120" x2="270" y2="180" class="topo-line" />
      <line x1="218" y1="110" x2="278" y2="170" class="topo-double" />
    </g>

    <!-- Liaisons simples C3-C4-C5-C6 -->
    <path class="topo-line" d="M 270 180 L 330 120 L 390 180 L 450 120" />
  </g>

  <!-- ==================== CADRAN D (BAS DROITE) : hex-2-yne ==================== -->
  <g transform="translate(620, 360)">
    <rect class="card" width="540" height="300" />
    <text x="30" y="45" class="label-text">D</text>
    <!-- Topologie hex-2-yne : C1(130, 150) - C2(200, 150) ≡ C3(290, 150) - C4(360, 110) - C5(420, 170) - C6(470, 120) -->
    <!-- Liaison simple C1-C2 (linéaire) -->
    <line x1="130" y1="150" x2="200" y2="150" class="topo-line" />
    
    <!-- TRIPLE LIAISON C2≡C3 (linéaire) -->
    <line x1="200" y1="150" x2="290" y2="150" class="topo-line" />
    <line x1="200" y1="140" x2="290" y2="140" class="topo-triple" />
    <line x1="200" y1="160" x2="290" y2="160" class="topo-triple" />

    <!-- Liaisons C3-C4-C5-C6 -->
    <path class="topo-line" d="M 290 150 L 350 100 L 410 160 L 470 110" />
  </g>
</svg>

