<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow2" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#f1f5f9" rx="16"/>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1140" height="46" rx="8" fill="#e2e8f0" opacity="0.8"/>
  <text x="600" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Comparaison de quatre structures dérivées d’un motif acyle
  </text>

  <!-- ==================== MOLÉCULE A (Ester) ==================== -->
  <!-- Box Top-Left: X=40, Y=85, W=520, H=255 -->
  <g filter="url(#shadow2)">
    <rect x="40" y="85" width="520" height="255" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Badge Molécule A -->
    <rect x="60" y="105" width="130" height="32" rx="6" fill="#2563eb"/>
    <text x="125" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Molécule A
    </text>

    <!-- Formula Drawing A: CH3 - C(=O) - O - CH2 - CH3 -->
    <g font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#0f172a">
      <!-- CH3 (Methyl left) -->
      <text x="170" y="208" text-anchor="middle">CH<tspan font-size="17" dy="4">3</tspan></text>
      
      <!-- Bond CH3 - C -->
      <line x1="205" y1="200" x2="245" y2="200" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Carbonyl Carbon C (Target Q24 at X=270, Y=200) -->
      <text x="270" y="208" text-anchor="middle" fill="#0f172a">C</text>
      
      <!-- Double Bond C=O (Vertical upwards) -->
      <line x1="264" y1="180" x2="264" y2="152" stroke="#0f172a" stroke-width="2"/>
      <line x1="276" y1="180" x2="276" y2="152" stroke="#0f172a" stroke-width="2"/>
      <!-- Oxygen =O -->
      <text x="270" y="145" text-anchor="middle" fill="#dc2626">O</text>
      
      <!-- Single Bond C - O -->
      <line x1="290" y1="200" x2="325" y2="200" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Ester Oxygen -O- -->
      <text x="345" y="208" text-anchor="middle" fill="#dc2626">O</text>
      
      <!-- Single Bond O - CH2 -->
      <line x1="365" y1="200" x2="395" y2="200" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Ethyl group -CH2-CH3 -->
      <text x="450" y="208" text-anchor="middle">CH<tspan font-size="17" dy="4">2</tspan><tspan font-size="24" dy="-4">—CH</tspan><tspan font-size="17" dy="4">3</tspan></text>
    </g>
  </g>

  <!-- ==================== MOLÉCULE B (Amide) ==================== -->
  <!-- Box Top-Right: X=640, Y=85, W=520, H=255 -->
  <g filter="url(#shadow2)">
    <rect x="640" y="85" width="520" height="255" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Badge Molécule B -->
    <rect x="660" y="105" width="130" height="32" rx="6" fill="#059669"/>
    <text x="725" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Molécule B
    </text>

    <!-- Formula Drawing B: CH3 - C(=O) - NH2 -->
    <g font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#0f172a">
      <!-- CH3 -->
      <text x="780" y="208" text-anchor="middle">CH<tspan font-size="17" dy="4">3</tspan></text>
      
      <!-- Bond CH3 - C -->
      <line x1="815" y1="200" x2="855" y2="200" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Carbonyl Carbon C -->
      <text x="880" y="208" text-anchor="middle">C</text>
      
      <!-- Double Bond C=O -->
      <line x1="874" y1="180" x2="874" y2="152" stroke="#0f172a" stroke-width="2"/>
      <line x1="886" y1="180" x2="886" y2="152" stroke="#0f172a" stroke-width="2"/>
      <text x="880" y="145" text-anchor="middle" fill="#dc2626">O</text>
      
      <!-- Single Bond C - NH2 -->
      <line x1="900" y1="200" x2="940" y2="200" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Amide Group NH2 -->
      <text x="980" y="208" text-anchor="middle" fill="#2563eb">NH<tspan font-size="17" dy="4">2</tspan></text>
    </g>
  </g>

  <!-- ==================== MOLÉCULE C (Chlorure d'acyle) ==================== -->
  <!-- Box Bottom-Left: X=40, Y=375, W=520, H=255 -->
  <g filter="url(#shadow2)">
    <rect x="40" y="375" width="520" height="255" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Badge Molécule C -->
    <rect x="60" y="395" width="130" height="32" rx="6" fill="#d97706"/>
    <text x="125" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Molécule C
    </text>

    <!-- Formula Drawing C: CH3 - C(=O) - Cl -->
    <g font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#0f172a">
      <!-- CH3 -->
      <text x="180" y="498" text-anchor="middle">CH<tspan font-size="17" dy="4">3</tspan></text>
      
      <!-- Bond CH3 - C -->
      <line x1="215" y1="490" x2="255" y2="490" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Carbonyl Carbon C -->
      <text x="280" y="498" text-anchor="middle">C</text>
      
      <!-- Double Bond C=O -->
      <line x1="274" y1="470" x2="274" y2="442" stroke="#0f172a" stroke-width="2"/>
      <line x1="286" y1="470" x2="286" y2="442" stroke="#0f172a" stroke-width="2"/>
      <text x="280" y="435" text-anchor="middle" fill="#dc2626">O</text>
      
      <!-- Single Bond C - Cl -->
      <line x1="300" y1="490" x2="340" y2="490" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Chlorine Cl -->
      <text x="365" y="498" text-anchor="middle" fill="#047857">Cl</text>
    </g>
  </g>

  <!-- ==================== MOLÉCULE D (Ion carboxylate avec délocalisation) ==================== -->
  <!-- Box Bottom-Right: X=640, Y=375, W=520, H=255 -->
  <g filter="url(#shadow2)">
    <rect x="640" y="375" width="520" height="255" rx="12" fill="url(#cardGrad)" stroke="#c026d3" stroke-width="2"/>
    
    <!-- Badge Molécule D -->
    <rect x="660" y="395" width="130" height="32" rx="6" fill="#a21caf"/>
    <text x="725" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Molécule D
    </text>

    <!-- Formula Drawing D: CH3 - C(O)2- with resonance representation -->
    <g font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#0f172a">
      <!-- CH3 -->
      <text x="770" y="498" text-anchor="middle">CH<tspan font-size="17" dy="4">3</tspan></text>
      
      <!-- Bond CH3 - C -->
      <line x1="805" y1="490" x2="845" y2="490" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Carbon C -->
      <text x="870" y="498" text-anchor="middle">C</text>

      <!-- Upper Oxygen O (solid & dashed bonds for resonance) -->
      <line x1="885" y1="472" x2="930" y2="445" stroke="#0f172a" stroke-width="2.5"/>
      <line x1="892" y1="462" x2="937" y2="435" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="955" y="440" text-anchor="middle" fill="#dc2626">O<tspan font-size="16" dy="-8">δ−</tspan></text>

      <!-- Lower Oxygen O (solid & dashed bonds for resonance) -->
      <line x1="885" y1="508" x2="930" y2="535" stroke="#0f172a" stroke-width="2.5"/>
      <line x1="892" y1="518" x2="937" y2="545" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="955" y="555" text-anchor="middle" fill="#dc2626">O<tspan font-size="16" dy="-8">δ−</tspan></text>
    </g>
  </g>

  <!-- Bottom Legend Banner -->
  <rect x="40" y="645" width="1120" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="670" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">
    Comparaison des quatre espèces A, B, C et D dérivées d’un même motif acyle
  </text>
</svg>
