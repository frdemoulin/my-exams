<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="panelLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="panelRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" rx="16"/>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1140" height="46" rx="8" fill="#e2e8f0" opacity="0.8"/>
  <text x="600" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Segment peptidique Tyr–His–Asp (pH 7,4) et étude de la conformation protéique
  </text>

  <!-- ==================== PANNEAU GAUCHE : TRIPEPTIDE Tyr-His-Asp ==================== -->
  <!-- Box Left: X=30, Y=85, W=750, H=590 -->
  <g filter="url(#shadow)">
    <rect x="30" y="85" width="750" height="590" rx="12" fill="url(#panelLeftGrad)" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Header Left Panel -->
    <rect x="50" y="105" width="280" height="32" rx="6" fill="#0284c7"/>
    <text x="190" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Séquence peptidique Tyr–His–Asp (pH 7,4)
    </text>

    <!-- Chemical Backbone Line (Y = 280) -->
    <g font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#0f172a">
      
      <!-- 1. N-terminal ammonium (+H3N) at X=85, Y=280 -->
      <g transform="translate(85, 280)">
        <text text-anchor="middle" fill="#2563eb">
          <tspan font-size="15" dy="-7">+</tspan><tspan font-size="22" dy="7">H</tspan><tspan font-size="15" dy="3">3</tspan><tspan font-size="22" dy="-3">N</tspan>
        </text>
        <rect x="-35" y="30" width="70" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
        <text x="0" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">N-term</text>
      </g>
      
      <!-- Bond N - Calpha(Tyr) -->
      <line x1="120" y1="272" x2="170" y2="272" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- 2. Résidu 1 : TYROSINE (Calpha at X=200, Y=280) -->
      <g transform="translate(200, 280)">
        <text text-anchor="middle">CH</text>
        <text x="0" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0284c7">Tyr</text>
        
        <!-- Side chain extending UPWARDS: -CH2 - C6H4 - OH -->
        <line x1="0" y1="-18" x2="0" y2="-50" stroke="#0f172a" stroke-width="2.5"/>
        <text x="0" y="-60" text-anchor="middle" fill="#0369a1">CH<tspan font-size="15" dy="3">2</tspan></text>
        <line x1="0" y1="-80" x2="0" y2="-100" stroke="#0f172a" stroke-width="2.5"/>
        <!-- Phenol ring (Hexagon schematic) -->
        <polygon points="0,-105 20,-115 20,-135 0,-145 -20,-135 -20,-115" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <line x1="0" y1="-145" x2="0" y2="-165" stroke="#0f172a" stroke-width="2.5"/>
        <text x="0" y="-175" text-anchor="middle" fill="#dc2626">OH</text>
      </g>
      
      <!-- Bond Calpha(Tyr) - C(=O) -->
      <line x1="225" y1="272" x2="280" y2="272" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Carbonyl 1: C(=O) at X=300, Y=280 -->
      <g transform="translate(300, 280)">
        <text text-anchor="middle">C</text>
        <line x1="-5" y1="15" x2="-5" y2="35" stroke="#0f172a" stroke-width="2"/>
        <line x1="5" y1="15" x2="5" y2="35" stroke="#0f172a" stroke-width="2"/>
        <text x="0" y="55" text-anchor="middle" fill="#dc2626">O</text>
      </g>
      
      <!-- Bond C(=O) - NH -->
      <line x1="315" y1="272" x2="365" y2="272" stroke="#0f172a" stroke-width="2.5"/>
      <text x="385" y="280" text-anchor="middle" fill="#2563eb">NH</text>
      <line x1="405" y1="272" x2="435" y2="272" stroke="#0f172a" stroke-width="2.5"/>

      <!-- 3. Résidu 2 : HISTIDINE (Calpha at X=450, Y=280) -->
      <g transform="translate(450, 280)">
        <text text-anchor="middle">CH</text>
        <text x="0" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0284c7">His</text>
        
        <!-- Side chain extending DOWNWARDS: -CH2 - Imidazole ring -->
        <line x1="0" y1="40" x2="0" y2="70" stroke="#0f172a" stroke-width="2.5"/>
        <text x="0" y="95" text-anchor="middle" fill="#7c3aed">CH<tspan font-size="15" dy="3">2</tspan></text>
        <line x1="0" y1="105" x2="0" y2="130" stroke="#0f172a" stroke-width="2.5"/>
        <!-- Imidazole Pentagon ring schematic -->
        <polygon points="0,135 25,150 15,180 -15,180 -25,150" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
        <text x="0" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6b21a8">N, NH</text>
      </g>
      
      <!-- Bond Calpha(His) - C(=O) -->
      <line x1="475" y1="272" x2="525" y2="272" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Carbonyl 2: C(=O) at X=540, Y=280 -->
      <g transform="translate(540, 280)">
        <text text-anchor="middle">C</text>
        <line x1="-5" y1="15" x2="-5" y2="35" stroke="#0f172a" stroke-width="2"/>
        <line x1="5" y1="15" x2="5" y2="35" stroke="#0f172a" stroke-width="2"/>
        <text x="0" y="55" text-anchor="middle" fill="#dc2626">O</text>
      </g>
      
      <!-- Bond C(=O) - NH -->
      <line x1="555" y1="272" x2="590" y2="272" stroke="#0f172a" stroke-width="2.5"/>
      <text x="610" y="280" text-anchor="middle" fill="#2563eb">NH</text>
      <line x1="630" y1="272" x2="655" y2="272" stroke="#0f172a" stroke-width="2.5"/>

      <!-- 4. Résidu 3 : ASPARTATE (Calpha at X=670, Y=280) -->
      <g transform="translate(670, 280)">
        <text text-anchor="middle">CH</text>
        <text x="0" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0284c7">Asp</text>
        
        <!-- Side chain extending UPWARDS: -CH2 - COO- (Target Q24 at X=670, Y=140) -->
        <line x1="0" y1="-18" x2="0" y2="-55" stroke="#0f172a" stroke-width="2.5"/>
        <text x="0" y="-65" text-anchor="middle" fill="#b91c1c">CH<tspan font-size="15" dy="3">2</tspan></text>
        <line x1="0" y1="-85" x2="0" y2="-115" stroke="#0f172a" stroke-width="2.5"/>
        
        <!-- TARGET Q24: Carboxylate group of Asp side chain centered at (670, 140) -->
        <g transform="translate(0, -140)">
          <rect x="-45" y="-22" width="90" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
          <text x="0" y="8" text-anchor="middle" fill="#b91c1c" font-size="22" font-weight="800">
            COO<tspan font-size="16" dy="-7">−</tspan>
          </text>
          <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b">Chaîne latérale</text>
        </g>
      </g>
      
      <!-- Bond Calpha(Asp) - C-terminal COO- -->
      <line x1="695" y1="272" x2="715" y2="272" stroke="#0f172a" stroke-width="2.5"/>

      <!-- C-terminal carboxylate (-COO-) at X=755, Y=280 -->
      <g transform="translate(755, 280)">
        <text text-anchor="middle" fill="#dc2626">
          COO<tspan font-size="16" dy="-7">−</tspan>
        </text>
        <rect x="-35" y="30" width="70" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="0" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">C-term</text>
      </g>
    </g>
  </g>

  <!-- ==================== PANNEAU DROITE : CONFORMATION PROTÉIQUE ==================== -->
  <!-- Box Right: X=800, Y=85, W=370, H=590 -->
  <g filter="url(#shadow)">
    <rect x="800" y="85" width="370" height="590" rx="12" fill="url(#panelRightGrad)" stroke="#c026d3" stroke-width="2"/>
    
    <!-- Header Right Panel -->
    <rect x="820" y="105" width="220" height="32" rx="6" fill="#c026d3"/>
    <text x="930" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Étude de conformation
    </text>

    <!-- Top Box: Protéine native -->
    <g transform="translate(820, 160)">
      <rect width="330" height="210" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
      <text x="165" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#7e22ce">
        Protéine native
      </text>
      
      <!-- Folded Globular Schema -->
      <path d="M 105 130 C 70 80, 130 60, 165 90 C 200 120, 240 70, 210 140 C 180 200, 100 180, 105 130 Z" fill="#f3e8ff" stroke="#a855f7" stroke-dasharray="0" stroke-width="4"/>
      <path d="M 125 110 C 145 95, 175 115, 185 140" fill="none" stroke="#c026d3" stroke-width="3"/>
      <circle cx="165" cy="125" r="14" fill="#a855f7" opacity="0.3"/>
    </g>

    <!-- Arrow between Conformations -->
    <path d="M 985 385 L 985 415" fill="none" stroke="#c026d3" stroke-width="3" marker-end="url(#arrowReactC)"/>

    <!-- Bottom Box: Protéine après modification du milieu -->
    <g transform="translate(820, 425)">
      <rect width="330" height="225" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
      <text x="165" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#7e22ce">
        Protéine après modification du milieu
      </text>

      <!-- Unfolded Extended Schema -->
      <path d="M 30 140 Q 70 60, 120 120 T 210 90 T 300 160" fill="none" stroke="#c026d3" stroke-dasharray="6,4" stroke-width="4"/>
      <circle cx="30" cy="140" r="6" fill="#2563eb"/>
      <text x="30" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">N-term</text>

      <circle cx="300" cy="160" r="6" fill="#dc2626"/>
      <text x="300" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">C-term</text>
    </g>
  </g>
</svg>

