<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="boxAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="boxBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="boxPepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" rx="16"/>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1140" height="46" rx="8" fill="#e2e8f0" opacity="0.8"/>
  <text x="600" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Structures des acides aminés A et B à pH ≈ 7 et du dipeptide A–B
  </text>

  <!-- ==================== MOLÉCULE A (Acide aminé A) ==================== -->
  <!-- Box Top-Left: X=40, Y=85, W=540, H=260 -->
  <g filter="url(#shadow)">
    <rect x="40" y="85" width="540" height="260" rx="12" fill="url(#boxAGrad)" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Badge Acide aminé A -->
    <rect x="60" y="105" width="150" height="32" rx="6" fill="#2563eb"/>
    <text x="135" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Acide aminé A
    </text>

    <!-- Formula A: +H3N - CH(CH2-SH) - COO- -->
    <g font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#0f172a">
      <!-- N-terminal ammonium (+H3N) -->
      <text x="140" y="215" text-anchor="middle" fill="#2563eb">
        <tspan font-size="16" dy="-8">+</tspan><tspan font-size="24" dy="8">H</tspan><tspan font-size="17" dy="4">3</tspan><tspan font-size="24" dy="-4">N</tspan>
      </text>
      
      <!-- Bond N - Calpha -->
      <line x1="175" y1="207" x2="225" y2="207" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Calpha - H -->
      <text x="250" y="215" text-anchor="middle">CH</text>
      
      <!-- Bond Calpha - C-terminal -->
      <line x1="275" y1="207" x2="325" y2="207" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- C-terminal carboxylate (-COO-) -->
      <text x="385" y="215" text-anchor="middle" fill="#dc2626">
        COO<tspan font-size="18" dy="-8">−</tspan>
      </text>
      
      <!-- Side chain bond Calpha -> CH2-SH (downwards) -->
      <line x1="250" y1="225" x2="250" y2="265" stroke="#0f172a" stroke-width="2.5"/>
      <!-- Side chain CH2-SH -->
      <text x="250" y="295" text-anchor="middle" fill="#059669">
        CH<tspan font-size="17" dy="4">2</tspan><tspan font-size="24" dy="-4">—SH</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== MOLÉCULE B (Acide aminé B) ==================== -->
  <!-- Box Top-Right: X=620, Y=85, W=540, H=260 -->
  <g filter="url(#shadow)">
    <rect x="620" y="85" width="540" height="260" rx="12" fill="url(#boxBGrad)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Badge Acide aminé B -->
    <rect x="640" y="105" width="150" height="32" rx="6" fill="#059669"/>
    <text x="715" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Acide aminé B
    </text>

    <!-- Formula B: +H3N - CH2 - COO- -->
    <g font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#0f172a">
      <!-- N-terminal ammonium (+H3N) -->
      <text x="730" y="215" text-anchor="middle" fill="#2563eb">
        <tspan font-size="16" dy="-8">+</tspan><tspan font-size="24" dy="8">H</tspan><tspan font-size="17" dy="4">3</tspan><tspan font-size="24" dy="-4">N</tspan>
      </text>
      
      <!-- Bond N - CH2 -->
      <line x1="765" y1="207" x2="825" y2="207" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- CH2 -->
      <text x="865" y="215" text-anchor="middle">CH<tspan font-size="17" dy="4">2</tspan></text>
      
      <!-- Bond CH2 - COO- -->
      <line x1="905" y1="207" x2="965" y2="207" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- C-terminal carboxylate (-COO-) -->
      <text x="1025" y="215" text-anchor="middle" fill="#dc2626">
        COO<tspan font-size="18" dy="-8">−</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== DIPEPTIDE A-B ==================== -->
  <!-- Box Bottom: X=40, Y=375, W=1120, H=280 -->
  <g filter="url(#shadow)">
    <rect x="40" y="375" width="1120" height="280" rx="12" fill="url(#boxPepGrad)" stroke="#c026d3" stroke-width="2"/>
    
    <!-- Badge Dipeptide A-B -->
    <rect x="60" y="395" width="160" height="32" rx="6" fill="#a21caf"/>
    <text x="140" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Dipeptide A–B
    </text>

    <!-- Formula Dipeptide A-B: +H3N - CH(CH2-SH) - C(=O) - NH - CH2 - COO- -->
    <g font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#0f172a">
      <!-- N-terminal label & structure -->
      <g transform="translate(130, 490)">
        <text text-anchor="middle" fill="#2563eb">
          <tspan font-size="16" dy="-8">+</tspan><tspan font-size="24" dy="8">H</tspan><tspan font-size="17" dy="4">3</tspan><tspan font-size="24" dy="-4">N</tspan>
        </text>
        <rect x="-40" y="40" width="80" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
        <text x="0" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">N-terminal</text>
      </g>
      
      <!-- Bond N - Calpha1 -->
      <line x1="170" y1="482" x2="230" y2="482" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Calpha1 (Résidu A) -->
      <g transform="translate(260, 490)">
        <text text-anchor="middle">CH</text>
        <!-- Side chain Calpha1 -> CH2-SH -->
        <line x1="0" y1="18" x2="0" y2="50" stroke="#0f172a" stroke-width="2.5"/>
        <text x="0" y="80" text-anchor="middle" fill="#059669">
          CH<tspan font-size="17" dy="4">2</tspan><tspan font-size="24" dy="-4">—SH</tspan>
        </text>
      </g>
      
      <!-- Bond Calpha1 - C(=O) -->
      <line x1="290" y1="482" x2="360" y2="482" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Carbonyl Carbon C (=O) -->
      <g transform="translate(390, 490)">
        <text text-anchor="middle">C</text>
        <!-- Double bond C=O (upwards) -->
        <line x1="-6" y1="-25" x2="-6" y2="-55" stroke="#0f172a" stroke-width="2"/>
        <line x1="6" y1="-25" x2="6" y2="-55" stroke="#0f172a" stroke-width="2"/>
        <text x="0" y="-62" text-anchor="middle" fill="#dc2626">O</text>
      </g>
      
      <!-- Single Bond C - NH (Peptide bond backbone) -->
      <line x1="410" y1="482" x2="520" y2="482" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Amide Group NH -->
      <g transform="translate(550, 490)">
        <text text-anchor="middle" fill="#2563eb">NH</text>
      </g>
      
      <!-- Single Bond NH - Calpha2 -->
      <line x1="580" y1="482" x2="690" y2="482" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- Calpha2 (Résidu B: CH2) -->
      <g transform="translate(730, 490)">
        <text text-anchor="middle">CH<tspan font-size="17" dy="4">2</tspan></text>
      </g>
      
      <!-- Single Bond Calpha2 - COO- -->
      <line x1="770" y1="482" x2="870" y2="482" stroke="#0f172a" stroke-width="2.5"/>
      
      <!-- C-terminal carboxylate (-COO-) -->
      <g transform="translate(930, 490)">
        <text text-anchor="middle" fill="#dc2626">
          COO<tspan font-size="18" dy="-8">−</tspan>
        </text>
        <rect x="-40" y="40" width="80" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="0" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">C-terminal</text>
      </g>
    </g>
  </g>
</svg>

