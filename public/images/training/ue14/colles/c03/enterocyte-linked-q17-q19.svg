<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 14px; }
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .lumen-text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0284c7; text-anchor: middle; }
      .blood-text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
      .cell-body { fill: #f1f5f9; stroke: #334155; stroke-width: 3; stroke-linejoin: round; }
      .microvilli { fill: #f1f5f9; stroke: #334155; stroke-width: 3; stroke-linecap: round; }
      .nucleus { fill: #cbd5e1; stroke: #475569; stroke-width: 2.5; }
      .nucleolus { fill: #64748b; }
      .junction-zone { fill: #ef4444; stroke: #dc2626; stroke-width: 1.5; }
      .protein-apical { fill: #0284c7; stroke: #0369a1; stroke-width: 1.5; }
      .protein-basolateral { fill: #16a34a; stroke: #15803d; stroke-width: 1.5; }
      
      /* Inset styles */
      .inset-box { fill: #ffffff; stroke: #2563eb; stroke-width: 2.5; rx: 12px; }
      .inset-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      .guide-line { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 5,5; fill: none; }

      /* Actin bundle filaments in enlarged microvillus */
      .mv-membrane { fill: #f8fafc; stroke: #0f172a; stroke-width: 4; stroke-linecap: round; }
      .actin-filament { stroke: #2563eb; stroke-width: 3.5; stroke-linecap: round; }
      .terminal-web { stroke: #3b82f6; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6,4; }
      .cross-link { stroke: #60a5fa; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="700" rx="16" />

  <!-- ==================== PARTIE GAUCHE : ENTÉROCYTE POLARISÉ ==================== -->
  <g transform="translate(40, 30)">
    <rect class="card" width="620" height="640" />

    <!-- Zones extracellulaires -->
    <rect x="20" y="20" width="580" height="50" rx="8" fill="#e0f2fe" />
    <text x="310" y="52" class="lumen-text">Lumière intestinale (Pôle apical)</text>

    <rect x="20" y="570" width="580" height="50" rx="8" fill="#fee2e2" />
    <text x="310" y="602" class="blood-text">Interstitium / Milieu intérieur (Pôle basolatéral)</text>

    <!-- Corps de l'entérocyte (Cellule haute) -->
    <!-- Contour cellulaire principal avec microvillosités au sommet -->
    <path class="cell-body" d="
      M 200 160
      C 200 160, 200 140, 205 140 C 210 140, 210 160, 210 160
      C 210 160, 210 140, 215 140 C 220 140, 220 160, 220 160
      C 220 160, 220 140, 225 140 C 230 140, 230 160, 230 160
      C 230 160, 230 140, 235 140 C 240 140, 240 160, 240 160
      C 240 160, 240 140, 245 140 C 250 140, 250 160, 250 160
      C 250 160, 250 140, 255 140 C 260 140, 260 160, 260 160
      C 260 160, 260 140, 265 140 C 270 140, 270 160, 270 160
      C 270 160, 270 140, 275 140 C 280 140, 280 160, 280 160
      C 280 160, 280 140, 285 140 C 290 140, 290 160, 290 160
      C 290 160, 290 140, 295 140 C 300 140, 300 160, 300 160
      C 300 160, 300 140, 305 140 C 310 140, 310 160, 310 160
      C 310 160, 310 140, 315 140 C 320 140, 320 160, 320 160
      C 320 160, 320 140, 325 140 C 330 140, 330 160, 330 160
      C 330 160, 330 140, 335 140 C 340 140, 340 160, 340 160
      C 340 160, 340 140, 345 140 C 350 140, 350 160, 350 160
      C 350 160, 350 140, 355 140 C 360 140, 360 160, 360 160
      C 360 160, 360 140, 365 140 C 370 140, 370 160, 370 160
      C 370 160, 370 140, 375 140 C 380 140, 380 160, 380 160
      C 380 160, 380 140, 385 140 C 390 140, 390 160, 390 160
      C 390 160, 390 140, 395 140 C 400 140, 400 160, 400 160
      C 400 160, 400 140, 405 140 C 410 140, 410 160, 410 160
      C 410 160, 410 140, 415 140 C 420 140, 420 160, 420 160
      L 430 160 L 430 550 L 190 550 L 190 160 Z
    " />

    <!-- Jonctions apico-latérales (représentation schématique) -->
    <circle cx="190" cy="180" r="6" class="junction-zone" />
    <circle cx="190" cy="195" r="6" class="junction-zone" />
    <circle cx="430" cy="180" r="6" class="junction-zone" />
    <circle cx="430" cy="195" r="6" class="junction-zone" />

    <!-- Noyau au pôle basal -->
    <ellipse cx="310" cy="450" rx="75" ry="50" class="nucleus" />
    <circle cx="290" cy="445" r="14" class="nucleolus" />

    <!-- Protéines membranaires stylisées -->
    <!-- Apical -->
    <ellipse cx="260" cy="140" rx="8" ry="5" class="protein-apical" />
    <ellipse cx="360" cy="140" rx="8" ry="5" class="protein-apical" />
    <!-- Basolatéral -->
    <rect x="184" y="380" width="12" height="20" rx="4" class="protein-basolateral" />
    <rect x="424" y="380" width="12" height="20" rx="4" class="protein-basolateral" />
    <rect x="270" y="544" width="20" height="12" rx="4" class="protein-basolateral" />
    <rect x="350" y="544" width="20" height="12" rx="4" class="protein-basolateral" />
  </g>

  <!-- Ligne de guidage reliant une microvillosité à l'encart d'agrandissement -->
  <path d="M 435 170 L 690 170 L 690 110 L 710 110" class="guide-line" />

  <!-- ==================== PARTIE DROITE : ENCART AGRANDISSEMENT MICROVILLOSITÉ ==================== -->
  <g transform="translate(690, 30)">
    <rect class="inset-box" width="470" height="640" />
    <text x="235" y="40" class="inset-title">Agrandissement d'une microvillosité apicale</text>

    <!-- Support d'agrandissement de la microvillosité -->
    <g transform="translate(0, 30)">
      <!-- Contour de la microvillosité (membrane plasmique) -->
      <!-- Membrane s'étendant verticalement -->
      <path class="mv-membrane" d="
        M 120 540
        L 120 180
        C 120 100, 350 100, 350 180
        L 350 540
      " />

      <!-- AXE CYTOSQUELETTIQUE : FAISCEAU PARALLÈLE DE FILAMENTS D'ACTINE (CIBLE QZONE) -->
      <!-- Filaments verticaux parallèles au centre de la microvillosité -->
      <g id="actin-bundle-target">
        <line x1="180" y1="140" x2="180" y2="520" class="actin-filament" />
        <line x1="205" y1="130" x2="205" y2="530" class="actin-filament" />
        <line x1="235" y1="125" x2="235" y2="535" class="actin-filament" />
        <line x1="265" y1="130" x2="265" y2="530" class="actin-filament" />
        <line x1="290" y1="140" x2="290" y2="520" class="actin-filament" />

        <!-- Ponts d'interconnexion (réticulation du faisceau d'actine) -->
        <line x1="180" y1="180" x2="290" y2="180" class="cross-link" />
        <line x1="180" y1="240" x2="290" y2="240" class="cross-link" />
        <line x1="180" y1="300" x2="290" y2="300" class="cross-link" />
        <line x1="180" y1="360" x2="290" y2="360" class="cross-link" />
        <line x1="180" y1="420" x2="290" y2="420" class="cross-link" />
        <line x1="180" y1="480" x2="290" y2="480" class="cross-link" />
      </g>

      <!-- Réseau sous-apical (trame terminale / terminal web) -->
      <line x1="80" y1="520" x2="390" y2="520" class="terminal-web" />
      <line x1="80" y1="550" x2="390" y2="550" class="terminal-web" />
    </g>
  </g>
</svg>

