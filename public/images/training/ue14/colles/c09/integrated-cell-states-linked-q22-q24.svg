<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="panelAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="panelBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <marker id="arrowFlow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" rx="16"/>

  <!-- Title Banner -->
  <rect x="30" y="18" width="1140" height="44" rx="8" fill="#e2e8f0" opacity="0.8"/>
  <text x="600" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Étude comparative d'une même lignée cellulaire : Interphase sécrétrice vs Métaphase
  </text>

  <!-- ==================== PANNEAU A : INTERPHASE SÉCRÉTRICE (GAUCHE) ==================== -->
  <g filter="url(#shadow)" transform="translate(30, 80)">
    <rect width="555" height="595" rx="12" fill="url(#panelAGrad)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Badge Panneau A -->
    <rect x="20" y="20" width="180" height="34" rx="6" fill="#059669"/>
    <text x="110" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Panneau A
    </text>
    <text x="215" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#047857">
      (Cellule en interphase)
    </text>

    <!-- Cell Outline (Panneau A) -->
    <path d="M 60 280 C 50 140, 180 90, 320 100 C 480 110, 520 220, 510 380 C 500 520, 340 560, 180 540 C 70 520, 70 420, 60 280 Z" fill="#ecfdf5" stroke="#10b981" stroke-width="3.5"/>
    <text x="440" y="545" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">
      Membrane plasmique
    </text>

    <!-- Noyau avec enveloppe intacte (X = 230, Y = 320) -->
    <g transform="translate(230, 320)">
      <ellipse cx="0" cy="0" rx="90" ry="75" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,3"/>
      <circle cx="-15" cy="-10" r="22" fill="#1d4ed8" opacity="0.6"/>
      <!-- Chromatine décondensée -->
      <path d="M -50 20 C -20 40, 20 10, 50 30 M -40 -30 C 0 -40, 30 -10, 40 -30" fill="none" stroke="#1e40af" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af">
        Noyau
      </text>
    </g>

    <!-- RER (Réticulum Endoplasmique Rugeux) -->
    <g transform="translate(180, 160)">
      <path d="M -70 20 C -50 0, 50 0, 80 20 M -60 35 C -40 15, 60 15, 90 35 M -50 50 C -30 30, 70 30, 100 50" fill="none" stroke="#2563eb" stroke-width="4"/>
      <!-- Ribosomes on RER -->
      <circle cx="-50" cy="12" r="3" fill="#1e40af"/>
      <circle cx="0" cy="10" r="3" fill="#1e40af"/>
      <circle cx="50" cy="12" r="3" fill="#1e40af"/>
      <circle cx="-30" cy="27" r="3" fill="#1e40af"/>
      <circle cx="20" cy="25" r="3" fill="#1e40af"/>
      <text x="120" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af">
        RER
      </text>
    </g>

    <!-- Golgi / TGN -->
    <g transform="translate(410, 310)">
      <path d="M -30 -40 C 0 -50, 30 -50, 40 -30 M -35 -20 C 0 -30, 35 -30, 45 -10 M -40 0 C 0 -10, 40 -10, 50 10 M -35 20 C 0 10, 35 10, 45 30" fill="none" stroke="#c026d3" stroke-width="4.5"/>
      <text x="0" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#86198f">
        Golgi
      </text>
    </g>

    <!-- Compartiment lysosomal -->
    <g transform="translate(420, 440)">
      <circle cx="0" cy="0" r="22" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
      <circle cx="-5" cy="-5" r="4" fill="#c2410c"/>
      <circle cx="6" cy="4" r="5" fill="#c2410c"/>
      <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c2410c">
        Compartiment lysosomal
      </text>
    </g>

    <!-- Mitochondries (Panneau A) -->
    <g transform="translate(130, 450)">
      <ellipse cx="0" cy="0" rx="35" ry="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <path d="M -20 0 L -10 -8 L 0 0 L 10 -8 L 20 0" fill="none" stroke="#b45309" stroke-width="1.5"/>
      <text x="0" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#b45309">
        Mitochondrie
      </text>
    </g>
    <g transform="translate(290, 480)">
      <ellipse cx="0" cy="0" rx="30" ry="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    </g>

    <!-- Secretory Vesicles & Traffic Flows -->
    <!-- Flow RER -> Golgi -->
    <path d="M 230 200 L 370 280" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowFlow)"/>
    <!-- Flow Golgi -> Plasma membrane -->
    <path d="M 440 330 L 485 360" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowFlow)"/>
    <!-- Secretory vesicle -->
    <circle cx="460" cy="345" r="8" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <!-- Flow Golgi -> Lysosome -->
    <path d="M 430 360 L 425 410" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowFlow)"/>
  </g>

  <!-- ==================== PANNEAU B : MÉTAPHASE (DROITE) ==================== -->
  <g filter="url(#shadow)" transform="translate(615, 80)">
    <rect width="555" height="595" rx="12" fill="url(#panelBGrad)" stroke="#c026d3" stroke-width="2"/>
    
    <!-- Badge Panneau B -->
    <rect x="20" y="20" width="180" height="34" rx="6" fill="#a21caf"/>
    <text x="110" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
      Panneau B
    </text>
    <text x="215" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#86198f">
      (Cellule en division)
    </text>

    <!-- Rounded Cell Body (Panneau B) -->
    <circle cx="280" cy="300" r="220" fill="#faf5ff" stroke="#c026d3" stroke-width="3.5"/>

    <!-- ==================== SPINDLE & CHROMOSOMES ==================== -->

    <!-- Left Centrosome (Pole 1) at X = 115, Y = 300 -->
    <g transform="translate(115, 300)">
      <circle cx="0" cy="0" r="14" fill="#a855f7" stroke="#7e22ce" stroke-width="2"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- Right Centrosome (Pole 2) at X = 445, Y = 300 -->
    <g transform="translate(445, 300)">
      <circle cx="0" cy="0" r="14" fill="#a855f7" stroke="#7e22ce" stroke-width="2"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- Spindle Microtubules (Lines from Centrosomes to Metaphase Plate X = 280) -->
    <g stroke="#d8b4fe" stroke-width="2" opacity="0.85">
      <!-- Left Pole Fibers -->
      <line x1="115" y1="300" x2="280" y2="170"/>
      <line x1="115" y1="300" x2="280" y2="220"/>
      <line x1="115" y1="300" x2="280" y2="260"/>
      <line x1="115" y1="300" x2="280" y2="300"/>
      <line x1="115" y1="300" x2="280" y2="340"/>
      <line x1="115" y1="300" x2="280" y2="380"/>
      <line x1="115" y1="300" x2="280" y2="430"/>

      <!-- Right Pole Fibers -->
      <line x1="445" y1="300" x2="280" y2="170"/>
      <line x1="445" y1="300" x2="280" y2="220"/>
      <line x1="445" y1="300" x2="280" y2="260"/>
      <line x1="445" y1="300" x2="280" y2="300"/>
      <line x1="445" y1="300" x2="280" y2="340"/>
      <line x1="445" y1="300" x2="280" y2="380"/>
      <line x1="445" y1="300" x2="280" y2="430"/>
    </g>

    <!-- ==================== TARGET Q24 : EQUATORIAL CHROMOSOME ALIGNMENT ==================== -->
    <!-- Centered at X = 280 (Canvas X = 895, Y = 380) -->
    <g transform="translate(280, 300)">

      <!-- Chromosome 1 (Top) -->
      <g transform="translate(0, -130)">
        <path d="M -18 -18 C -5 -5, -5 5, -18 18 M 18 -18 C 5 -5, 5 5, 18 18" fill="none" stroke="#9333ea" stroke-width="7" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="5" fill="#7e22ce"/>
      </g>

      <!-- Chromosome 2 -->
      <g transform="translate(0, -80)">
        <path d="M -20 -18 C -6 -5, -6 5, -20 18 M 20 -18 C 6 -5, 6 5, 20 18" fill="none" stroke="#9333ea" stroke-width="7" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="5" fill="#7e22ce"/>
      </g>

      <!-- Chromosome 3 (Center) -->
      <g transform="translate(0, -30)">
        <path d="M -22 -18 C -7 -5, -7 5, -22 18 M 22 -18 C 7 -5, 7 5, 22 18" fill="none" stroke="#9333ea" stroke-width="7" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="5" fill="#7e22ce"/>
      </g>

      <!-- Chromosome 4 -->
      <g transform="translate(0, 25)">
        <path d="M -20 -18 C -6 -5, -6 5, -20 18 M 20 -18 C 6 -5, 6 5, 20 18" fill="none" stroke="#9333ea" stroke-width="7" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="5" fill="#7e22ce"/>
      </g>

      <!-- Chromosome 5 (Bottom) -->
      <g transform="translate(0, 80)">
        <path d="M -18 -18 C -5 -5, -5 5, -18 18 M 18 -18 C 5 -5, 5 5, 18 18" fill="none" stroke="#9333ea" stroke-width="7" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="5" fill="#7e22ce"/>
      </g>
      
      <!-- Chromosome 6 (Far Bottom) -->
      <g transform="translate(0, 130)">
        <path d="M -16 -18 C -4 -5, -4 5, -16 18 M 16 -18 C 4 -5, 4 5, 16 18" fill="none" stroke="#9333ea" stroke-width="7" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="5" fill="#7e22ce"/>
      </g>
    </g>
  </g>
</svg>

