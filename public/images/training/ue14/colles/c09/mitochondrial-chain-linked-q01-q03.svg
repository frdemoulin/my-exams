<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="imsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <marker id="arrowE" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" rx="16"/>

  <!-- Title Banner -->
  <rect x="30" y="15" width="1140" height="42" rx="8" fill="#e2e8f0" opacity="0.8"/>
  <text x="600" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">
    Organisation mitochondriale, complexe TOM et chaîne respiratoire
  </text>

  <!-- ==================== VUE D'ENSEMBLE MITOCHONDRIE (HAUT) ==================== -->
  <g filter="url(#shadow)" transform="translate(30, 65)">
    <rect width="1140" height="175" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0369a1">
      Vue d'ensemble mitochondriale &amp; import protéique
    </text>

    <!-- Oval Mitochondria Outer Shape -->
    <g transform="translate(180, 95)">
      <!-- Outer Membrane -->
      <ellipse cx="0" cy="0" rx="140" ry="60" fill="url(#imsGrad)" stroke="#0284c7" stroke-width="3"/>
      <text x="0" y="-68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284c7">
        Membrane externe
      </text>

      <!-- TOM Complex in Outer Membrane -->
      <rect x="-15" y="-64" width="30" height="12" rx="3" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
      <text x="0" y="-70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff"></text>
      <!-- Label TOM -->
      <rect x="25" y="-72" width="55" height="20" rx="4" fill="#7c3aed"/>
      <text x="52" y="-58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">TOM</text>
      <line x1="15" y1="-58" x2="25" y2="-62" stroke="#7c3aed" stroke-width="1.5"/>

      <!-- Inner Membrane with Cristae -->
      <path d="M -110 0 C -110 -35, -40 -35, -40 0 C -40 35, 30 35, 30 0 C 30 -35, 110 -35, 110 0 C 110 40, -110 40, -110 0 Z" fill="url(#matrixGrad)" stroke="#d97706" stroke-width="2.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#b45309">
        Matrice mitochondriale
      </text>
      <text x="-80" y="-38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0369a1">
        Espace intermembranaire
      </text>
    </g>

    <!-- Transfer Flow Schematic Overview -->
    <g transform="translate(680, 95)">
      <rect x="-240" y="-45" width="480" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="0" y="-22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#334155">
        Trajet global des électrons dans la membrane interne
      </text>
      
      <!-- Flow Text -->
      <g font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">
        <text x="-190" y="20" fill="#0284c7">Complexe I / II</text>
        <text x="-80" y="20" fill="#2563eb">→</text>
        <text x="-50" y="20" fill="#d97706">Q</text>
        <text x="-20" y="20" fill="#2563eb">→</text>
        <text x="10" y="20" fill="#059669">Complexe III</text>
        <text x="110" y="20" fill="#2563eb">→</text>
        <text x="135" y="20" fill="#10b981">cyt c</text>
        <text x="175" y="20" fill="#2563eb">→</text>
        <text x="195" y="20" fill="#dc2626">Complexe IV</text>
        <text x="290" y="20" fill="#2563eb">→</text>
        <text x="310" y="20" font-size="20" fill="#dc2626">?</text>
      </g>
    </g>
  </g>

  <!-- ==================== ZOOM MEMBRANE INTERNE & COMPLEXES (BAS) ==================== -->
  <g filter="url(#shadow)" transform="translate(30, 250)">
    <rect width="1140" height="425" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Regions Backgrounds -->
    <!-- Intermembrane Space (Top) -->
    <rect x="15" y="15" width="1110" height="100" rx="6" fill="url(#imsGrad)"/>
    <text x="35" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0369a1">
      Espace intermembranaire
    </text>

    <!-- Inner Membrane Bilayer (Middle) -->
    <rect x="15" y="125" width="1110" height="150" rx="4" fill="url(#memGrad)"/>
    <text x="35" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      Membrane interne
    </text>

    <!-- Matrix (Bottom) -->
    <rect x="15" y="285" width="1110" height="125" rx="6" fill="url(#matrixGrad)"/>
    <text x="35" y="315" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#b45309">
      Matrice mitochondriale
    </text>

    <!-- ==================== COMPLEXES ==================== -->

    <!-- Complexe I (X = 140) -->
    <g transform="translate(140, 110)">
      <rect x="-40" y="0" width="80" height="180" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <text x="0" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
        Complexe I
      </text>
    </g>

    <!-- Complexe II (X = 300) -->
    <g transform="translate(300, 140)">
      <rect x="-35" y="0" width="70" height="140" rx="10" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
      <text x="0" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">
        Complexe II
      </text>
    </g>

    <!-- Ubiquinone Q (X = 440, embedded in membrane) -->
    <g transform="translate(440, 175)">
      <circle cx="0" cy="0" r="28" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
      <text x="0" y="7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">
        Q
      </text>
      <text x="0" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#78350f">
        Ubiquinone
      </text>
    </g>

    <!-- Complexe III (X = 580) -->
    <g transform="translate(580, 110)">
      <rect x="-40" y="0" width="80" height="180" rx="10" fill="#059669" stroke="#047857" stroke-width="2"/>
      <text x="0" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
        Complexe III
      </text>
    </g>

    <!-- Cytochrome c (X = 720, peripheral in intermembrane space) -->
    <g transform="translate(720, 85)">
      <circle cx="0" cy="0" r="25" fill="#10b981" stroke="#047857" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">
        cyt c
      </text>
      <text x="0" y="-32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">
        Cytochrome c
      </text>
    </g>

    <!-- Complexe IV (X = 860) -->
    <g transform="translate(860, 110)">
      <rect x="-40" y="0" width="80" height="180" rx="10" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
      <text x="0" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
        Complexe IV
      </text>

      <!-- Arrow from Complex IV to un-named acceptor (?) in Matrix -->
      <path d="M 0 180 L 0 230" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowE)"/>
      <g transform="translate(0, 260)">
        <circle cx="0" cy="0" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#dc2626">
          ?
        </text>
        <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">
          Accepteur final
        </text>
      </g>
    </g>

    <!-- ATP Synthase (X = 1040) -->
    <g transform="translate(1040, 130)">
      <!-- F0 in membrane -->
      <rect x="-25" y="0" width="50" height="130" rx="6" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
      <!-- F1 in matrix -->
      <circle cx="0" cy="165" r="30" fill="#a78bfa" stroke="#6d28d9" stroke-width="2"/>
      <text x="0" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">
        F0
      </text>
      <text x="0" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
        F1
      </text>
      <text x="0" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#5b21b6">
        ATP synthase
      </text>
    </g>

    <!-- Electron Transfer Pathway Arrows -->
    <path d="M 180 180 L 220 180 L 410 185" fill="none" stroke="#2563eb" stroke-dasharray="4,3" stroke-width="2.5" marker-end="url(#arrowE)"/>
    <path d="M 335 180 L 410 180" fill="none" stroke="#2563eb" stroke-dasharray="4,3" stroke-width="2.5" marker-end="url(#arrowE)"/>
    <path d="M 470 175 L 540 175" fill="none" stroke="#2563eb" stroke-dasharray="4,3" stroke-width="2.5" marker-end="url(#arrowE)"/>
    <path d="M 620 125 L 695 85" fill="none" stroke="#2563eb" stroke-dasharray="4,3" stroke-width="2.5" marker-end="url(#arrowE)"/>
    <path d="M 745 85 L 820 125" fill="none" stroke="#2563eb" stroke-dasharray="4,3" stroke-width="2.5" marker-end="url(#arrowE)"/>
  </g>
</svg>

