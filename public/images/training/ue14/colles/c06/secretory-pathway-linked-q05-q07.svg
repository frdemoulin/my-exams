<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Gradients for Organelles -->
    <linearGradient id="reGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="golgiCisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="golgiTransGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="endoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="lysoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="pmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arrowAnt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrowRet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" stroke-dasharray="0" />
    </marker>
    <marker id="arrowSec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowLyso" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c026d3" />
    </marker>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#f8fafc" rx="16"/>

  <!-- Title banner -->
  <rect x="30" y="25" width="1140" height="46" rx="8" fill="#e2e8f0" opacity="0.6"/>
  <text x="600" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">
    Voie sécrétoire et tri intracellulaire des protéines A et B
  </text>

  <!-- 1. RÉTICULUM ENDOPLASMIQUE (RE) -->
  <g filter="url(#shadow)">
    <path d="M 70 180 C 130 150, 220 150, 260 190 C 300 230, 220 270, 160 250 C 100 230, 80 320, 150 340 C 220 360, 280 300, 270 390 C 260 460, 160 450, 120 480 C 80 510, 180 560, 250 520 C 300 490, 290 410, 260 380" 
          fill="url(#reGrad)" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Ribosomes on RE -->
    <circle cx="90" cy="185" r="4" fill="#1e3a8a"/>
    <circle cx="120" cy="175" r="4" fill="#1e3a8a"/>
    <circle cx="150" cy="170" r="4" fill="#1e3a8a"/>
    <circle cx="180" cy="172" r="4" fill="#1e3a8a"/>
    <circle cx="210" cy="180" r="4" fill="#1e3a8a"/>
    <circle cx="95" cy="305" r="4" fill="#1e3a8a"/>
    <circle cx="115" cy="325" r="4" fill="#1e3a8a"/>
    <circle cx="140" cy="338" r="4" fill="#1e3a8a"/>
    <circle cx="110" cy="495" r="4" fill="#1e3a8a"/>
    <circle cx="135" cy="518" r="4" fill="#1e3a8a"/>
    
    <!-- RE Label -->
    <rect x="75" y="200" width="170" height="34" rx="6" fill="#ffffff" opacity="0.9" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="160" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e40af">
      Réticulum endoplasmique
    </text>
  </g>

  <!-- 2. FLUX RE -> GOLGI (Transport Antérograde & Rétrograde) -->
  <!-- Antérograde RE -> Golgi -->
  <path d="M 285 280 Q 340 260, 395 280" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowAnt)"/>
  <rect x="305" y="235" width="70" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="340" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e40af">Antérograde</text>

  <!-- Vésicule de transition -->
  <circle cx="340" cy="275" r="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <!-- Cargo A & B inside vesicle -->
  <circle cx="335" cy="275" r="5" fill="#0284c7"/>
  <polygon points="345,270 349,278 341,278" fill="#c026d3"/>

  <!-- Rétrograde Golgi -> RE -->
  <path d="M 395 330 Q 340 350, 285 330" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRet)"/>
  <rect x="305" y="348" width="70" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Rétrograde</text>

  <!-- 3. APPAREIL DE GOLGI -->
  <g filter="url(#shadow)">
    <!-- Cis-Golgi -->
    <path d="M 410 180 C 430 250, 430 350, 410 420 C 435 400, 445 280, 435 200 Z" fill="url(#golgiCisGrad)" stroke="#059669" stroke-width="2"/>
    <!-- Médian-Golgi -->
    <path d="M 445 170 C 470 240, 470 360, 445 430 C 470 410, 480 290, 470 190 Z" fill="url(#golgiCisGrad)" stroke="#059669" stroke-width="2"/>
    <!-- Trans-Golgi / TGN -->
    <path d="M 480 160 C 510 230, 510 370, 480 440 C 510 420, 520 280, 510 180 Z" fill="url(#golgiTransGrad)" stroke="#d97706" stroke-width="2.5"/>

    <!-- Golgi Labels -->
    <rect x="400" y="460" width="130" height="60" rx="8" fill="#ffffff" opacity="0.9" stroke="#059669" stroke-width="1.5"/>
    <text x="465" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#065f46">
      Appareil de Golgi
    </text>
    <text x="465" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#047857">
      Cis → Médian → Trans
    </text>
    <text x="465" y="512" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">
      Réseau Trans (TGN)
    </text>
  </g>

  <!-- 4. FLUX DEPUIS LE TGN -->

  <!-- A. VOIE SÉCRÉTOIRE (Protéine A) -> Membrane Plasmique -->
  <g>
    <!-- Trajet TGN vers Membrane plasmique -->
    <path d="M 515 220 C 620 180, 800 160, 990 180" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowSec)"/>
    
    <!-- Vésicule de sécrétion -->
    <circle cx="750" cy="180" r="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <circle cx="750" cy="180" r="7" fill="#0284c7"/>
    <text x="750" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">A</text>

    <!-- Exocytose sur la membrane -->
    <path d="M 985 160 Q 995 180, 985 200" fill="none" stroke="#0284c7" stroke-width="3"/>
    
    <!-- Label Voie Sécrétoire / Protéine A -->
    <rect x="650" y="115" width="220" height="42" rx="6" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="760" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0369a1">
      Voie de sécrétion (Protéine A)
    </text>
    <text x="760" y="149" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0284c7">
      TGN → Vésicule → Membrane
    </text>
  </g>

  <!-- B. VOIE LYSOSOMALE (Protéine B) -> Endosome -> Lysosome -->
  <g filter="url(#shadow)">
    <!-- Trajet TGN vers Endosome -->
    <path d="M 515 360 C 600 390, 640 430, 710 440" fill="none" stroke="#c026d3" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowLyso)"/>
    
    <!-- Vésicule de tri vers Endosome -->
    <circle cx="610" cy="410" r="16" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/>
    <polygon points="610,403 617,414 603,414" fill="#c026d3"/>
    <text x="610" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">B</text>

    <!-- ENDOSOME -->
    <circle cx="740" cy="450" r="35" fill="url(#endoGrad)" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="740" y="454" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">
      Endosome
    </text>

    <!-- Trajet Endosome -> Lysosome -->
    <path d="M 775 450 L 870 450" fill="none" stroke="#c026d3" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowLyso)"/>

    <!-- LYSOSOME -->
    <circle cx="930" cy="450" r="45" fill="url(#lysoGrad)" stroke="#be185d" stroke-width="3"/>
    <text x="930" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#831843">
      Lysosome
    </text>
    <text x="930" y="468" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9d174d">
      (Hydrolases)
    </text>
    
    <!-- Cargo B inside Lysosome -->
    <polygon points="930,420 936,430 924,430" fill="#c026d3"/>

    <!-- Label Voie Lysosomale / Protéine B -->
    <rect x="580" y="490" width="240" height="42" rx="6" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
    <text x="700" y="509" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#701a75">
      Voie lysosomale (Protéine B)
    </text>
    <text x="700" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a21caf">
      TGN → Endosome → Lysosome
    </text>
  </g>

  <!-- 5. MEMBRANE PLASMIQUE & MILIEU EXTRACELLULAIRE -->
  <g>
    <!-- Membrane Plasmique (Bicouche schématique) -->
    <rect x="1000" y="100" width="24" height="500" rx="12" fill="url(#pmGrad)"/>
    <text x="1012" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" transform="rotate(90, 1012, 360)">
      Membrane plasmique
    </text>

    <!-- Milieu Extracellulaire -->
    <rect x="1040" y="100" width="130" height="500" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4,4"/>
    <text x="1105" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">
      Milieu
    </text>
    <text x="1105" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">
      extracellulaire
    </text>

    <!-- Protéine A sécrétée dans le milieu extracellulaire -->
    <circle cx="1105" cy="180" r="10" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <text x="1105" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">A</text>
    <text x="1105" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369a1">
      Sécrétée
    </text>
  </g>

  <!-- LEGENDE / CARGOS CARTOUCHE -->
  <g filter="url(#shadow)">
    <rect x="50" y="590" width="1100" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="70" y="618" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      Légende du schéma :
    </text>
    
    <!-- Cargo A Legend -->
    <circle cx="210" cy="640" r="11" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <text x="210" y="644" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">A</text>
    <text x="230" y="645" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">
      Protéine A (Protéine soluble destinée à la sécrétion extracellulaire)
    </text>

    <!-- Cargo B Legend -->
    <polygon points="620,630 631,648 609,648" fill="#c026d3" stroke="#a21caf" stroke-width="2"/>
    <text x="620" y="646" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">B</text>
    <text x="640" y="645" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">
      Protéine B (Hydrolase soluble triée vers le compartiment lysosomal)
    </text>
  </g>
</svg>
