<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Trois constituants du cytosquelette</title>
<desc id="desc">Schéma pédagogique original comparant un filament d'actine, un filament intermédiaire et un microtubule sans nommer les trois structures.</desc>
<rect width="960" height="520" fill="white"/>
<text x="480" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Trois structures du cytosquelette</text>
<text x="170" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">A</text>
<text x="480" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">B</text>
<text x="760" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">C</text>
<!-- A : deux brins d'actine globulaire -->
<path d="M85 285 C115 230, 145 340, 175 285 S235 230, 265 285" fill="none" stroke="#222" stroke-width="4"/>
<path d="M85 305 C115 250, 145 360, 175 305 S235 250, 265 305" fill="none" stroke="#222" stroke-width="4"/>
<g fill="white" stroke="#222" stroke-width="3">
<circle cx="95" cy="283" r="13"/><circle cx="125" cy="266" r="13"/><circle cx="155" cy="300" r="13"/><circle cx="185" cy="318" r="13"/><circle cx="215" cy="284" r="13"/><circle cx="245" cy="268" r="13"/>
</g>
<!-- B : filament intermédiaire en corde -->
<path d="M385 210 C430 250, 430 330, 475 370" fill="none" stroke="#222" stroke-width="10" stroke-linecap="round"/>
<path d="M430 205 C475 245, 475 325, 520 365" fill="none" stroke="#222" stroke-width="10" stroke-linecap="round"/>
<path d="M475 210 C520 250, 520 330, 565 370" fill="none" stroke="#222" stroke-width="10" stroke-linecap="round"/>
<!-- C : cylindre microtubulaire -->
<ellipse cx="760" cy="185" rx="82" ry="30" fill="white" stroke="#222" stroke-width="4"/>
<ellipse cx="760" cy="365" rx="82" ry="30" fill="white" stroke="#222" stroke-width="4"/>
<line x1="678" y1="185" x2="678" y2="365" stroke="#222" stroke-width="4"/>
<line x1="842" y1="185" x2="842" y2="365" stroke="#222" stroke-width="4"/>
<line x1="704" y1="171" x2="704" y2="379" stroke="#222" stroke-width="3"/>
<line x1="732" y1="159" x2="732" y2="391" stroke="#222" stroke-width="3"/>
<line x1="760" y1="155" x2="760" y2="395" stroke="#222" stroke-width="3"/>
<line x1="788" y1="159" x2="788" y2="391" stroke="#222" stroke-width="3"/>
<line x1="816" y1="171" x2="816" y2="379" stroke="#222" stroke-width="3"/>
<g fill="white" stroke="#222" stroke-width="2">
<circle cx="704" cy="235" r="10"/><circle cx="704" cy="260" r="10"/>
<circle cx="732" cy="245" r="10"/><circle cx="732" cy="270" r="10"/>
<circle cx="760" cy="235" r="10"/><circle cx="760" cy="260" r="10"/>
<circle cx="788" cy="245" r="10"/><circle cx="788" cy="270" r="10"/>
<circle cx="816" cy="235" r="10"/><circle cx="816" cy="260" r="10"/>
</g>
<text x="480" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Schémas simplifiés — dimensions non à l’échelle</text>
</svg>