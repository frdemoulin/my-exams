<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
<rect width="900" height="700" fill="#ffffff"/>
<text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">Sites endocriniens — schéma simplifié</text>

<!-- repère A : rein + glande surrénale -->
<text x="205" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">A</text>
<ellipse cx="205" cy="315" rx="78" ry="115" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
<path d="M145 210 Q205 140 265 210 Z" fill="#ffffff" stroke="#111827" stroke-width="5"/>
<text x="205" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#475569">rein</text>

<!-- repère B : gonades -->
<text x="470" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">B</text>
<ellipse cx="420" cy="285" rx="55" ry="42" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
<ellipse cx="520" cy="285" rx="55" ry="42" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
<text x="470" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#475569">gonades</text>

<!-- repère C : placenta simplifié -->
<text x="735" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">C</text>
<ellipse cx="735" cy="285" rx="90" ry="62" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
<path d="M690 285 C710 240 760 240 780 285 C760 330 710 330 690 285 Z" fill="none" stroke="#64748b" stroke-width="3"/>
<text x="735" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#475569">placenta</text>

</svg>