<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .double { stroke:#111; stroke-width:4; stroke-linecap:round; }
    .triple { stroke:#111; stroke-width:4; stroke-linecap:round; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrow); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 27px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 39px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:white; stroke:#111; stroke-width:3; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
  </defs>
  
<text x="70" y="60" class="title">Figure E4 — Additions successives de dibrome</text>

<text x="60" y="310" class="txt">CH3—C≡C—CH3</text>
<line x1="350" y1="295" x2="555" y2="295" class="arrow"/>
<text x="415" y="245" class="small">+ Br2</text>
<text x="590" y="310" class="txt">CH3—CBr=CBr—CH3</text>
<line x1="970" y1="295" x2="1155" y2="295" class="arrow"/>
<text x="1020" y="245" class="small">+ Br2</text>
<text x="1180" y="290" class="txt">CH3—CBr2</text>
<text x="1215" y="350" class="txt">|</text>
<text x="1180" y="410" class="txt">CBr2—CH3</text>

<text x="80" y="485" class="small">but-2-yne</text>
<text x="655" y="485" class="small">dibromoalcène</text>
<text x="1175" y="485" class="small">dérivé tétrabromé</text>
<text x="390" y="585" class="small">1 équivalent : une double liaison subsiste</text>
<text x="940" y="635" class="small">2 équivalents au total : disparition de toute insaturation</text>

</svg>