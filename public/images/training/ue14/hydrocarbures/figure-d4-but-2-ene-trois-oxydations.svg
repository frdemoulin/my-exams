<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .thin { stroke:#111; stroke-width:3; stroke-linecap:round; fill:none; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 26px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:#fff; stroke:#111; stroke-width:3; rx:16; }
  </style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#111"/></marker></defs>
  
<text x="60" y="60" class="title">Figure D4 — Le but-2-ène soumis à trois oxydations</text>
<text x="80" y="145" class="txt">CH3–CH=CH–CH3</text>

<line x1="360" y1="130" x2="520" y2="130" class="arrow"/>
<text x="385" y="100" class="small">douce</text>
<rect x="545" y="70" width="610" height="120" class="box"/>
<text x="610" y="125" class="label">époxyde sur C2–C3</text>
<text x="615" y="165" class="small">une seule molécule à quatre carbones</text>

<text x="80" y="370" class="txt">CH3–CH=CH–CH3</text>
<line x1="360" y1="355" x2="520" y2="355" class="arrow"/>
<text x="375" y="325" class="small">modérée</text>
<rect x="545" y="290" width="690" height="130" class="box"/>
<text x="590" y="350" class="label">CH3–CH(OH)–CH(OH)–CH3</text>
<text x="715" y="395" class="small">butane-2,3-diol</text>

<text x="80" y="600" class="txt">CH3–CH=CH–CH3</text>
<line x1="360" y1="585" x2="520" y2="585" class="arrow"/>
<text x="390" y="555" class="small">forte</text>
<rect x="545" y="520" width="630" height="130" class="box"/>
<text x="665" y="580" class="label">2 CH3–CHO</text>
<text x="675" y="625" class="small">deux molécules d'éthanal</text>

</svg>