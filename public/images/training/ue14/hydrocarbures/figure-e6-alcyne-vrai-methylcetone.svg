<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .double { stroke:#111; stroke-width:4; stroke-linecap:round; }
    .triple { stroke:#111; stroke-width:4; stroke-linecap:round; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrow); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 27px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 39px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:white; stroke:#111; stroke-width:3; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
  </defs>
  
<text x="70" y="60" class="title">Figure E6 — Alcyne vrai : énol puis méthylcétone</text>

<text x="60" y="310" class="txt">R—C≡CH</text>
<line x1="280" y1="295" x2="500" y2="295" class="arrow"/>
<text x="340" y="245" class="small">+ H2O</text>
<text x="540" y="310" class="txt">R—C(OH)=CH2</text>
<line x1="855" y1="295" x2="1080" y2="295" class="arrow"/>
<text x="900" y="245" class="small">tautomérie</text>
<text x="1125" y="310" class="txt">R—CO—CH3</text>

<text x="80" y="420" class="small">alcyne vrai</text>
<text x="610" y="420" class="small">énol intermédiaire</text>
<text x="1165" y="420" class="small">méthylcétone</text>

<text x="80" y="590" class="small">Exemple : CH3—C≡CH  →  CH3—CO—CH3</text>
<text x="80" y="650" class="small">propyne  →  propanone</text>

</svg>