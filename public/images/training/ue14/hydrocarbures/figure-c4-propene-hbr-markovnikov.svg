<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect x="0" y="0" width="1200" height="720" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .dbl { stroke:#111; stroke-width:5; stroke-linecap:round; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
    .txt { font: 32px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 24px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:#fff; stroke:#222; stroke-width:3; rx:16; }
  </style>
  <defs><marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#111"/></marker></defs>
  
<text x="55" y="55" class="title">Figure C4 — Addition de HBr sur le propène</text>
<text x="70" y="230" class="txt">CH3–CH=CH2</text>
<text x="160" y="315" class="txt">+ HBr</text>
<line x1="420" y1="245" x2="570" y2="245" class="arrow"/>
<rect x="625" y="120" width="500" height="150" class="box"/>
<text x="660" y="180" class="small">Produit A</text><text x="660" y="235" class="txt">CH3–CH2–CH2Br</text>
<rect x="625" y="345" width="500" height="150" class="box"/>
<text x="660" y="405" class="small">Produit B — attendu selon Markovnikov</text><text x="660" y="460" class="txt">CH3–CHBr–CH3</text>
<text x="100" y="565" class="small">H sur le carbone terminal ; Br sur le carbone central.</text>

</svg>