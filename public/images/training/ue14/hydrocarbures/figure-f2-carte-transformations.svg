<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .thin { stroke:#111; stroke-width:3; stroke-linecap:round; fill:none; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 27px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 31px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 39px Arial, Helvetica, sans-serif; fill:#111; }
    .formula { font: 32px 'DejaVu Sans Mono', 'Courier New', monospace; fill:#111; }
    .box { fill:#fff; stroke:#111; stroke-width:3; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#111"/>
    </marker>
  </defs>
  
<text x="55" y="60" class="title">Figure F2 — Trois voies de préparation d'un alcène</text>

<text x="70" y="150" class="label">Voie A</text>
<text x="230" y="150" class="formula">CH3–CH2OH</text>
<line x1="500" y1="140" x2="750" y2="140" class="arrow"/>
<text x="555" y="110" class="small">– H2O</text>
<text x="820" y="150" class="formula">CH2=CH2</text>

<text x="70" y="320" class="label">Voie B</text>
<text x="230" y="320" class="formula">CH3–CH2Br</text>
<line x1="500" y1="310" x2="750" y2="310" class="arrow"/>
<text x="555" y="280" class="small">– HBr</text>
<text x="820" y="320" class="formula">CH2=CH2</text>

<text x="70" y="490" class="label">Voie C</text>
<text x="230" y="490" class="formula">HC≡CH</text>
<line x1="450" y1="480" x2="690" y2="480" class="arrow"/>
<text x="510" y="450" class="small">+ H2, catalyseur</text>
<text x="740" y="490" class="formula">CH2=CH2</text>
<line x1="980" y1="480" x2="1190" y2="480" class="arrow"/>
<text x="1030" y="450" class="small">+ H2</text>
<text x="1220" y="490" class="formula">CH3–CH3</text>

<text x="70" y="660" class="small">Les voies A et B sont des éliminations ; la voie C est une hydrogénation contrôlée.</text>

</svg>