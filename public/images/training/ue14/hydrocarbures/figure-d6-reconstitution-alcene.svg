<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .thin { stroke:#111; stroke-width:3; stroke-linecap:round; fill:none; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 26px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:#fff; stroke:#111; stroke-width:3; rx:16; }
  </style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#111"/></marker></defs>
  
<text x="60" y="60" class="title">Figure D6 — Reconstituer l'alcène à partir des produits</text>
<rect x="80" y="125" width="500" height="170" class="box"/>
<text x="130" y="190" class="label">CH3–CHO</text>
<text x="115" y="245" class="small">substituants : CH3 et H</text>

<rect x="800" y="125" width="500" height="170" class="box"/>
<text x="865" y="190" class="label">CH3–CO–CH3</text>
<text x="850" y="245" class="small">substituants : CH3 et CH3</text>

<line x1="440" y1="365" x2="930" y2="365" class="arrow"/>
<text x="530" y="330" class="small">relier les deux carbones carbonylés par C=C</text>
<rect x="380" y="440" width="650" height="160" class="box"/>
<text x="490" y="510" class="title">CH3–CH=C(CH3)2</text>
<text x="540" y="565" class="small">2-méthylbut-2-ène</text>

</svg>