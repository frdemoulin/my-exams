<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .thin { stroke:#111; stroke-width:3; stroke-linecap:round; fill:none; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 26px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:#fff; stroke:#111; stroke-width:3; rx:16; }
  </style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#111"/></marker></defs>
  
<text x="60" y="60" class="title">Figure D1 — Trois niveaux d'oxydation d'un alcène</text>
<text x="80" y="150" class="txt">R–CH=CH–R′</text>
<line x1="350" y1="135" x2="520" y2="135" class="arrow"/>
<text x="370" y="105" class="small">douce</text>
<rect x="540" y="75" width="320" height="130" class="box"/>
<text x="630" y="130" class="label">Époxyde</text>
<text x="575" y="175" class="small">cycle C–C–O, chaîne conservée</text>

<text x="80" y="370" class="txt">R–CH=CH–R′</text>
<line x1="350" y1="355" x2="520" y2="355" class="arrow"/>
<text x="360" y="325" class="small">modérée</text>
<rect x="540" y="295" width="500" height="130" class="box"/>
<text x="630" y="350" class="label">R–CH(OH)–CH(OH)–R′</text>
<text x="660" y="397" class="small">1,2-diol, chaîne conservée</text>

<text x="80" y="590" class="txt">R–CH=CH–R′</text>
<line x1="350" y1="575" x2="520" y2="575" class="arrow"/>
<text x="365" y="545" class="small">forte</text>
<rect x="540" y="505" width="560" height="145" class="box"/>
<text x="625" y="565" class="label">R–CHO + R′–CHO</text>
<text x="630" y="615" class="small">exemple : coupure en composés carbonylés</text>

</svg>