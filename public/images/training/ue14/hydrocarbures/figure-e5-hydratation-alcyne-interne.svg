<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .double { stroke:#111; stroke-width:4; stroke-linecap:round; }
    .triple { stroke:#111; stroke-width:4; stroke-linecap:round; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrow); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 27px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 39px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:white; stroke:#111; stroke-width:3; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
  </defs>
  
<text x="70" y="60" class="title">Figure E5 — Hydratation d'un alcyne interne non symétrique</text>

<text x="55" y="250" class="txt">R—C≡C—R′</text>
<line x1="310" y1="235" x2="490" y2="235" class="arrow"/>
<text x="350" y="190" class="small">+ H2O</text>

<text x="535" y="185" class="small">orientation 1</text>
<text x="535" y="250" class="txt">R—C(OH)=CH—R′</text>
<line x1="885" y1="235" x2="1040" y2="235" class="arrow"/>
<text x="900" y="190" class="small">tautomérie</text>
<text x="1080" y="250" class="txt">R—CO—CH2—R′</text>

<text x="535" y="500" class="small">orientation 2</text>
<text x="535" y="565" class="txt">R—CH=C(OH)—R′</text>
<line x1="885" y1="550" x2="1040" y2="550" class="arrow"/>
<text x="900" y="505" class="small">tautomérie</text>
<text x="1080" y="565" class="txt">R—CH2—CO—R′</text>

<line x1="360" y1="255" x2="500" y2="470" class="arrow"/>
<text x="720" y="700" class="small">Deux énols possibles peuvent conduire à deux cétones de constitution différente.</text>

</svg>