<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .double { stroke:#111; stroke-width:4; stroke-linecap:round; }
    .triple { stroke:#111; stroke-width:4; stroke-linecap:round; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrow); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 27px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 39px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:white; stroke:#111; stroke-width:3; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
  </defs>
  
<text x="70" y="60" class="title">Figure E2 — Position de la triple liaison</text>

<rect x="120" y="170" width="500" height="360" class="box"/>
<text x="300" y="225" class="label">But-1-yne</text>
<text x="195" y="335" class="txt">HC≡C—CH2—CH3</text>
<text x="220" y="430" class="small">triple liaison terminale</text>
<text x="260" y="475" class="small">alcyne vrai</text>

<rect x="780" y="170" width="500" height="360" class="box"/>
<text x="960" y="225" class="label">But-2-yne</text>
<text x="855" y="335" class="txt">CH3—C≡C—CH3</text>
<text x="875" y="430" class="small">triple liaison interne</text>
<text x="895" y="475" class="small">alcyne interne</text>

</svg>