<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .thin { stroke:#111; stroke-width:3; stroke-linecap:round; fill:none; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 27px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 31px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 39px Arial, Helvetica, sans-serif; fill:#111; }
    .formula { font: 32px 'DejaVu Sans Mono', 'Courier New', monospace; fill:#111; }
    .box { fill:#fff; stroke:#111; stroke-width:3; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#111"/>
    </marker>
  </defs>
  
<text x="55" y="60" class="title">Figure F5 — Produits d'une coupure oxydative</text>
<text x="85" y="135" class="small">L'alcène inconnu est soumis à une oxydation forte dans le modèle simplifié du cours.</text>

<rect x="90" y="210" width="490" height="260" class="box"/>
<text x="130" y="270" class="label">Éthanal</text>
<text x="165" y="365" class="formula">CH3–CHO</text>
<text x="130" y="420" class="small">ancien carbone : CH3, H</text>

<text x="650" y="350" class="title">+</text>

<rect x="800" y="210" width="490" height="260" class="box"/>
<text x="840" y="270" class="label">Propanone</text>
<text x="860" y="365" class="formula">CH3–CO–CH3</text>
<text x="840" y="420" class="small">ancien carbone : CH3, CH3</text>

<line x1="700" y1="560" x2="700" y2="665" class="arrow"/>
<text x="430" y="735" class="formula">Alcène à reconstituer :  CH3–CH=C(CH3)2</text>

</svg>