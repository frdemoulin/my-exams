<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .thin { stroke:#111; stroke-width:3; stroke-linecap:round; fill:none; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 26px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:#fff; stroke:#111; stroke-width:3; rx:16; }
  </style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#111"/></marker></defs>
  
<text x="60" y="60" class="title">Figure D3 — Oxydation modérée de l'éthène</text>
<text x="100" y="300" class="txt">CH2=CH2</text>
<line x1="320" y1="285" x2="540" y2="285" class="arrow"/>
<text x="340" y="245" class="small">oxydation modérée</text>
<text x="650" y="300" class="txt">HO–CH2–CH2–OH</text>
<text x="700" y="380" class="label">éthane-1,2-diol</text>
<text x="705" y="430" class="small">deux groupes OH voisins</text>

</svg>