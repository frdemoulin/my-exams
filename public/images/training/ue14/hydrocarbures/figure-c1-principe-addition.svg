<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect x="0" y="0" width="1200" height="720" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .dbl { stroke:#111; stroke-width:5; stroke-linecap:round; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
    .txt { font: 32px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 24px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:#fff; stroke:#222; stroke-width:3; rx:16; }
  </style>
  <defs><marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#111"/></marker></defs>
  
<text x="55" y="55" class="title">Figure C1 — Principe général d'une addition sur C=C</text>
<text x="100" y="180" class="txt">R</text><line x1="150" y1="170" x2="245" y2="270" class="bond"/>
<line x1="250" y1="260" x2="430" y2="260" class="dbl"/><line x1="250" y1="280" x2="430" y2="280" class="dbl"/>
<line x1="435" y1="270" x2="530" y2="170" class="bond"/><text x="540" y="180" class="txt">R'</text>
<text x="85" y="390" class="txt">A–B</text>
<line x1="620" y1="275" x2="790" y2="275" class="arrow"/>
<text x="845" y="180" class="txt">A</text><line x1="870" y1="195" x2="900" y2="270" class="bond"/>
<line x1="900" y1="270" x2="1030" y2="270" class="bond"/>
<line x1="1030" y1="270" x2="1060" y2="195" class="bond"/><text x="1065" y="180" class="txt">B</text>
<line x1="900" y1="270" x2="835" y2="365" class="bond"/><text x="780" y="405" class="txt">R</text>
<line x1="1030" y1="270" x2="1090" y2="365" class="bond"/><text x="1095" y="405" class="txt">R'</text>
<text x="330" y="500" class="small">La liaison π est consommée ; le squelette carboné reste intact.</text>

</svg>