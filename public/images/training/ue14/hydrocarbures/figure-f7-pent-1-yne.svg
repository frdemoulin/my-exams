<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .thin { stroke:#111; stroke-width:3; stroke-linecap:round; fill:none; }
    .arrow { stroke:#111; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 27px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 31px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 39px Arial, Helvetica, sans-serif; fill:#111; }
    .formula { font: 32px 'DejaVu Sans Mono', 'Courier New', monospace; fill:#111; }
    .box { fill:#fff; stroke:#111; stroke-width:3; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#111"/>
    </marker>
  </defs>
  
<text x="55" y="60" class="title">Figure F7 — Précurseur alcynique terminal</text>
<text x="485" y="245" class="formula">HC≡C–CH2–CH2–CH3</text>
<text x="600" y="315" class="label">pent-1-yne</text>

<line x1="240" y1="430" x2="530" y2="430" class="arrow"/>
<text x="285" y="395" class="small">+ H2, partiel</text>
<text x="95" y="500" class="formula">CH2=CH–CH2–CH2–CH3</text>
<text x="225" y="555" class="small">pent-1-ène</text>

<line x1="850" y1="430" x2="1140" y2="430" class="arrow"/>
<text x="915" y="395" class="small">+ 2 H2, complet</text>
<text x="970" y="500" class="formula">CH3–CH2–CH2–CH2–CH3</text>
<text x="1090" y="555" class="small">pentane</text>

<line x1="700" y1="350" x2="700" y2="640" class="arrow"/>
<text x="730" y="520" class="small">H2O, puis tautomérie</text>
<text x="505" y="730" class="formula">CH3–CO–CH2–CH2–CH3</text>
<text x="615" y="785" class="small">pentan-2-one</text>

</svg>