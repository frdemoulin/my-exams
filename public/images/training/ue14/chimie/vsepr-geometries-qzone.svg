<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#ffffff"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#111827">Géométries moléculaires — schémas simplifiés</text>
<g font-family="Arial,sans-serif" fill="#111827" stroke="#334155" stroke-width="5" stroke-linecap="round">
  <!-- A linear -->
  <g transform="translate(200,220)">
    <circle cx="0" cy="0" r="20" fill="#111827" stroke="none"/>
    <line x1="-110" y1="0" x2="-25" y2="0"/><line x1="25" y1="0" x2="110" y2="0"/>
    <circle cx="-125" cy="0" r="18" fill="#94a3b8" stroke="none"/><circle cx="125" cy="0" r="18" fill="#94a3b8" stroke="none"/>
    <text x="0" y="75" text-anchor="middle" font-size="20" stroke="none">A</text>
  </g>
  <!-- B trigonal planar -->
  <g transform="translate(600,220)">
    <circle cx="0" cy="0" r="20" fill="#111827" stroke="none"/>
    <line x1="0" y1="-25" x2="0" y2="-115"/><line x1="-22" y1="12" x2="-100" y2="58"/><line x1="22" y1="12" x2="100" y2="58"/>
    <circle cx="0" cy="-130" r="18" fill="#94a3b8" stroke="none"/><circle cx="-115" cy="68" r="18" fill="#94a3b8" stroke="none"/><circle cx="115" cy="68" r="18" fill="#94a3b8" stroke="none"/>
    <text x="0" y="105" text-anchor="middle" font-size="20" stroke="none">B</text>
  </g>
  <!-- C tetrahedral -->
  <g transform="translate(1000,220)">
    <circle cx="0" cy="0" r="20" fill="#111827" stroke="none"/>
    <line x1="0" y1="-25" x2="0" y2="-110"/><line x1="-20" y1="12" x2="-95" y2="62"/><line x1="20" y1="12" x2="95" y2="62"/><line x1="8" y1="20" x2="38" y2="120" stroke-dasharray="8,8"/>
    <circle cx="0" cy="-125" r="18" fill="#94a3b8" stroke="none"/><circle cx="-110" cy="72" r="18" fill="#94a3b8" stroke="none"/><circle cx="110" cy="72" r="18" fill="#94a3b8" stroke="none"/><circle cx="43" cy="135" r="18" fill="#94a3b8" stroke="none"/>
    <text x="0" y="175" text-anchor="middle" font-size="20" stroke="none">C</text>
  </g>
  <!-- D pyramidal -->
  <g transform="translate(200,515)">
    <circle cx="0" cy="0" r="20" fill="#111827" stroke="none"/>
    <line x1="-20" y1="12" x2="-100" y2="70"/><line x1="20" y1="12" x2="100" y2="70"/><line x1="0" y1="-22" x2="10" y2="-110"/>
    <circle cx="-115" cy="80" r="18" fill="#94a3b8" stroke="none"/><circle cx="115" cy="80" r="18" fill="#94a3b8" stroke="none"/><circle cx="12" cy="-125" r="18" fill="#94a3b8" stroke="none"/>
    <circle cx="45" cy="-50" r="7" fill="#111827" stroke="none"/><circle cx="62" cy="-50" r="7" fill="#111827" stroke="none"/>
    <text x="0" y="125" text-anchor="middle" font-size="20" stroke="none">D</text>
  </g>
  <!-- E bent -->
  <g transform="translate(600,515)">
    <circle cx="0" cy="0" r="20" fill="#111827" stroke="none"/>
    <line x1="-20" y1="10" x2="-100" y2="65"/><line x1="20" y1="10" x2="100" y2="65"/>
    <circle cx="-115" cy="75" r="18" fill="#94a3b8" stroke="none"/><circle cx="115" cy="75" r="18" fill="#94a3b8" stroke="none"/>
    <circle cx="-45" cy="-55" r="7" fill="#111827" stroke="none"/><circle cx="-28" cy="-55" r="7" fill="#111827" stroke="none"/>
    <circle cx="28" cy="-55" r="7" fill="#111827" stroke="none"/><circle cx="45" cy="-55" r="7" fill="#111827" stroke="none"/>
    <text x="0" y="125" text-anchor="middle" font-size="20" stroke="none">E</text>
  </g>
  <!-- F octahedral -->
  <g transform="translate(1000,515)">
    <circle cx="0" cy="0" r="20" fill="#111827" stroke="none"/>
    <line x1="-25" y1="0" x2="-105" y2="0"/><line x1="25" y1="0" x2="105" y2="0"/><line x1="0" y1="-25" x2="0" y2="-105"/><line x1="0" y1="25" x2="0" y2="105"/>
    <line x1="-15" y1="-15" x2="-75" y2="-75" stroke-dasharray="8,8"/><line x1="15" y1="15" x2="75" y2="75" stroke-dasharray="8,8"/>
    <circle cx="-120" cy="0" r="16" fill="#94a3b8" stroke="none"/><circle cx="120" cy="0" r="16" fill="#94a3b8" stroke="none"/><circle cx="0" cy="-120" r="16" fill="#94a3b8" stroke="none"/><circle cx="0" cy="120" r="16" fill="#94a3b8" stroke="none"/><circle cx="-85" cy="-85" r="16" fill="#94a3b8" stroke="none"/><circle cx="85" cy="85" r="16" fill="#94a3b8" stroke="none"/>
    <text x="0" y="165" text-anchor="middle" font-size="20" stroke="none">F</text>
  </g>
</g>
</svg>