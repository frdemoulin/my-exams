<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Formule topologique du 4-méthylhex-2-ène</title>
  <desc id="desc">Chaîne principale de six carbones en zigzag. Une double liaison relie les deuxième et troisième carbones en partant de la gauche. Un groupe méthyle est porté par le quatrième carbone.</desc>
  <rect x="0" y="0" width="1200" height="500" fill="white"/>
  <!-- Main carbon skeleton: C1-C2=C3-C4-C5-C6 -->
  <g fill="none" stroke="black" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="120" y1="260" x2="300" y2="160"/>
    <!-- double bond C2=C3 -->
    <line x1="300" y1="160" x2="480" y2="260"/>
    <line x1="310" y1="185" x2="470" y2="274" stroke-width="5"/>
    <line x1="480" y1="260" x2="660" y2="160"/>
    <line x1="660" y1="160" x2="840" y2="260"/>
    <line x1="840" y1="260" x2="1020" y2="160"/>
    <!-- methyl substituent on C4 -->
    <line x1="660" y1="160" x2="660" y2="45"/>
  </g>
</svg>
