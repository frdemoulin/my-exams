<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><rect width="1400" height="800" fill="white"/><text x="700" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#163b75">Points de contrôle du cycle cellulaire</text>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker></defs>
<circle cx="700" cy="410" r="260" fill="none" stroke="#d9e2ef" stroke-width="55"/>
<path d="M500 555 A260 260 0 0 1 520 250" fill="none" stroke="#76b7eb" stroke-width="50"/><path d="M520 250 A260 260 0 0 1 860 190" fill="none" stroke="#f3b35f" stroke-width="50"/><path d="M860 190 A260 260 0 0 1 960 505" fill="none" stroke="#8fd3a8" stroke-width="50"/><path d="M960 505 A260 260 0 0 1 500 555" fill="none" stroke="#cf9be8" stroke-width="50"/>
<text x="470" y="410" font-family="Arial" font-size="30" font-weight="700">G1</text><text x="690" y="135" font-family="Arial" font-size="30" font-weight="700">S</text><text x="1010" y="370" font-family="Arial" font-size="30" font-weight="700">G2</text><text x="710" y="710" font-family="Arial" font-size="30" font-weight="700">M</text>
<rect x="80" y="120" width="410" height="245" rx="20" fill="#eef6fd" stroke="#2f77b5" stroke-width="4"/><text x="285" y="155" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#2f77b5">Point de restriction G1</text><text x="110" y="200" font-family="Arial" font-size="22">• facteurs de croissance / nutriments</text><text x="110" y="235" font-family="Arial" font-size="22">• volume cellulaire</text><text x="110" y="270" font-family="Arial" font-size="22">• intégrité de l’ADN</text><text x="110" y="315" font-family="Arial" font-size="22">p16 ; p53 → p21 ; inhibition de cdc25</text>
<rect x="925" y="115" width="390" height="220" rx="20" fill="#effaf2" stroke="#3b9a61" stroke-width="4"/><text x="1120" y="150" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#3b9a61">Point G2</text><text x="955" y="195" font-family="Arial" font-size="22">• réplication achevée</text><text x="955" y="230" font-family="Arial" font-size="22">• ADN non lésé</text><text x="955" y="275" font-family="Arial" font-size="22">cdc25 + CAK activent B/CDK1</text><text x="955" y="310" font-family="Arial" font-size="22">Wee1 inhibe B/CDK1</text>
<rect x="930" y="520" width="390" height="210" rx="20" fill="#fbf1ff" stroke="#8e44ad" stroke-width="4"/><text x="1125" y="555" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#8e44ad">Point métaphasique</text><text x="960" y="600" font-family="Arial" font-size="22">• tous les chromosomes bi-orientés</text><text x="960" y="635" font-family="Arial" font-size="22">• APC/cdc20 actif</text><text x="960" y="670" font-family="Arial" font-size="22">• sécurine détruite → séparase active</text><text x="960" y="705" font-family="Arial" font-size="22">• cohésines clivées → anaphase</text>
