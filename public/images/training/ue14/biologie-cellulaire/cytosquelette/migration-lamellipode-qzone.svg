<text x="310" y="450" text-anchor="middle" font-family="Arial" font-size="22">arrière contractile</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#111"/></marker></defs>
<path d="M1030 100 L1140 100" stroke="#111" stroke-width="6" marker-end="url(#arrow)"/><text x="1080" y="85" text-anchor="middle" font-family="Arial" font-size="22">sens de migration</text>
