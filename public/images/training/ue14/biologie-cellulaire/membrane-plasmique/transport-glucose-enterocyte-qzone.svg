<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="white"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="32">Transport transcellulaire du glucose dans un entérocyte</text>
<text x="600" y="100" text-anchor="middle" font-family="Arial" font-size="24">Lumière intestinale — pôle apical</text>
<rect x="180" y="140" width="840" height="430" rx="35" fill="#f6f6f6" stroke="#333" stroke-width="6"/>
<text x="600" y="360" text-anchor="middle" font-family="Arial" font-size="30">Entérocyte</text>
<!-- apical microvilli -->
<g stroke="#555" stroke-width="8"><line x1="300" y1="140" x2="300" y2="105"/><line x1="350" y1="140" x2="350" y2="105"/><line x1="400" y1="140" x2="400" y2="105"/><line x1="450" y1="140" x2="450" y2="105"/><line x1="500" y1="140" x2="500" y2="105"/><line x1="550" y1="140" x2="550" y2="105"/><line x1="600" y1="140" x2="600" y2="105"/><line x1="650" y1="140" x2="650" y2="105"/></g>
<!-- SGLT1 -->
<rect x="350" y="125" width="115" height="55" rx="15" fill="#ddd" stroke="#111" stroke-width="5"/><text x="407" y="160" text-anchor="middle" font-family="Arial" font-size="22">SGLT1</text>
<path d="M390 85 L390 120" stroke="#111" stroke-width="5" marker-end="url(#arrow)"/><path d="M430 85 L430 120" stroke="#111" stroke-width="5" marker-end="url(#arrow)"/>
<text x="380" y="83" font-family="Arial" font-size="20">Glucose</text><text x="445" y="83" font-family="Arial" font-size="20">2 Na+</text>
<!-- basolateral GLUT2 and pump -->
<rect x="440" y="545" width="110" height="50" rx="12" fill="#e9e9e9" stroke="#111" stroke-width="4"/><text x="495" y="577" text-anchor="middle" font-family="Arial" font-size="21">GLUT2</text>
<rect x="690" y="535" width="160" height="65" rx="12" fill="#e0e0e0" stroke="#111" stroke-width="4"/><text x="770" y="562" text-anchor="middle" font-family="Arial" font-size="19">Na+/K+</text><text x="770" y="585" text-anchor="middle" font-family="Arial" font-size="19">ATPase</text>
<path d="M495 515 L495 540" stroke="#111" stroke-width="5" marker-end="url(#arrow)"/><text x="520" y="520" font-family="Arial" font-size="20">Glucose</text>
<text x="600" y="650" text-anchor="middle" font-family="Arial" font-size="24">Milieu interstitiel / sang — pôle basolatéral</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#111"/></marker></defs>
</svg>