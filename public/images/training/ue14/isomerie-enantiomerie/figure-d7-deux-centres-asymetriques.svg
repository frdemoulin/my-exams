<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <rect x="0" y="0" width="1200" height="780" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .thin { stroke:#333; stroke-width:2; }
    .dash { stroke:#111; stroke-width:3; stroke-dasharray:8 8; fill:none; }
    .wedge { fill:#111; stroke:none; }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 26px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .star { font: bold 28px Arial, Helvetica, sans-serif; fill:#c20; }
    .mono { font: 28px 'Courier New', monospace; fill:#111; }
  </style>
  
<text x="70" y="60" class="title">Figure D7 — Molécule à deux centres asymétriques</text>
<text x="70" y="120" class="small">Les deux centres stéréogènes sont repérés par des astérisques.</text>

<!-- backbone center1-center2-CH3 -->
<circle cx="360" cy="390" r="7" fill="#111"/>
<circle cx="620" cy="390" r="7" fill="#111"/>
<line x1="360" y1="390" x2="620" y2="390" class="bond"/>
<line x1="620" y1="390" x2="820" y2="390" class="bond"/>
<text x="835" y="402" class="txt">CH3</text>

<!-- center1 substituents -->
<line x1="360" y1="390" x2="360" y2="220" class="bond"/>
<polygon points="360,390 250,510 280,525" class="wedge"/>
<line x1="360" y1="390" x2="250" y2="250" class="dash"/>
<text x="335" y="205" class="txt">OH</text>
<text x="180" y="550" class="txt">Cl</text>
<text x="180" y="250" class="txt">H</text>
<text x="345" y="375" class="star">*</text>

<!-- center2 substituents -->
<polygon points="620,390 730,270 700,255" class="wedge"/>
<line x1="620" y1="390" x2="730" y2="520" class="dash"/>
<text x="742" y="268" class="txt">Br</text>
<text x="742" y="532" class="txt">H</text>
<text x="605" y="375" class="star">*</text>

</svg>