<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect x="0" y="0" width="1200" height="700" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .db1 { stroke:#111; stroke-width:5; stroke-linecap:round; }
    .db2 { stroke:#111; stroke-width:5; stroke-linecap:round; }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 28px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .star { font: bold 28px Arial, Helvetica, sans-serif; fill:#c20; }
    .thin { stroke:#333; stroke-width:2; }
    .dash { stroke:#111; stroke-width:3; stroke-dasharray:8 8; fill:none; }
    .wedge { fill:#111; stroke:none; }
  </style>
  
<text x="70" y="60" class="title">Figure C2 — Glycine et alanine</text>
<text x="110" y="130" class="label">Glycine</text>
<line x1="170" y1="300" x2="300" y2="300" class="bond"/>
<line x1="300" y1="300" x2="430" y2="300" class="bond"/>
<line x1="300" y1="300" x2="300" y2="210" class="bond"/>
<line x1="300" y1="300" x2="300" y2="390" class="bond"/>
<text x="85" y="312" class="txt">NH2</text>
<text x="440" y="312" class="txt">COOH</text>
<text x="285" y="205" class="txt">H</text>
<text x="275" y="430" class="txt">H</text>
<text x="290" y="290" class="star">α</text>

<text x="720" y="130" class="label">Alanine</text>
<line x1="780" y1="300" x2="910" y2="300" class="bond"/>
<line x1="910" y1="300" x2="1040" y2="300" class="bond"/>
<line x1="910" y1="300" x2="910" y2="210" class="bond"/>
<line x1="910" y1="300" x2="910" y2="390" class="bond"/>
<text x="695" y="312" class="txt">NH2</text>
<text x="1050" y="312" class="txt">COOH</text>
<text x="895" y="205" class="txt">H</text>
<text x="872" y="430" class="txt">CH3</text>
<text x="900" y="290" class="star">*</text>

</svg>