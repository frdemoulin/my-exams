<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect x="0" y="0" width="1400" height="820" fill="white"/>
  <style>
    .line { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .thin { stroke:#444; stroke-width:3; fill:none; }
    .dash { stroke:#666; stroke-width:3; stroke-dasharray:10 10; fill:none; }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 26px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 31px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 39px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:white; stroke:#111; stroke-width:4; }
    .plus { fill:#efefef; stroke:#111; stroke-width:2; }
    .minus { fill:white; stroke:#111; stroke-width:2; }
  </style>
  
<text x="60" y="65" class="title">Figure E1 — Schéma simplifié d'un polarimètre</text>

<!-- light source -->
<rect x="70" y="300" width="180" height="140" rx="18" class="box"/>
<text x="105" y="355" class="label">Source</text>
<text x="95" y="400" class="small">lampe Na</text>

<!-- polarizer -->
<rect x="330" y="280" width="170" height="180" rx="18" class="box"/>
<text x="350" y="350" class="label">Polariseur</text>
<line x1="380" y1="400" x2="450" y2="330" class="thin"/>
<line x1="390" y1="420" x2="470" y2="340" class="thin"/>

<!-- cuvette -->
<rect x="590" y="250" width="300" height="240" rx="25" class="box"/>
<rect x="625" y="285" width="230" height="170" rx="16" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
<text x="650" y="345" class="label">Solution chirale</text>
<text x="675" y="390" class="small">concentration c</text>
<text x="690" y="430" class="small">solvant, T</text>
<line x1="620" y1="535" x2="860" y2="535" class="thin"/>
<line x1="620" y1="520" x2="620" y2="550" class="thin"/>
<line x1="860" y1="520" x2="860" y2="550" class="thin"/>
<text x="720" y="580" class="small">longueur l</text>

<!-- analyzer -->
<rect x="990" y="280" width="170" height="180" rx="18" class="box"/>
<text x="1013" y="350" class="label">Analyseur</text>
<line x1="1030" y1="335" x2="1110" y2="415" class="thin"/>
<line x1="1050" y1="325" x2="1130" y2="405" class="thin"/>

<!-- reader -->
<rect x="1230" y="300" width="120" height="140" rx="18" class="box"/>
<text x="1245" y="355" class="label">Lecture</text>
<text x="1265" y="405" class="txt">α</text>

<!-- arrows -->
<line x1="250" y1="370" x2="330" y2="370" class="line"/>
<polygon points="330,370 305,355 305,385" fill="#111"/>
<line x1="500" y1="370" x2="590" y2="370" class="line"/>
<polygon points="590,370 565,355 565,385" fill="#111"/>
<line x1="890" y1="370" x2="990" y2="370" class="line"/>
<polygon points="990,370 965,355 965,385" fill="#111"/>
<line x1="1160" y1="370" x2="1230" y2="370" class="line"/>
<polygon points="1230,370 1205,355 1205,385" fill="#111"/>

<text x="250" y="680" class="small">L'angle observé dépend notamment de la longueur d'onde, du solvant, de la température, de la concentration et de la longueur de cuve.</text>

</svg>