<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .db { stroke:#111; stroke-width:5; stroke-linecap:round; }
    .dash { stroke:#111; stroke-width:3; stroke-dasharray:8 8; fill:none; }
    .wedge { fill:#111; stroke:none; }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 25px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .star { font: bold 28px Arial, Helvetica, sans-serif; fill:#c20; }
    .card { fill:#fff; stroke:#111; stroke-width:3; }
  </style>
  
<text x="60" y="60" class="title">Figure S1 — Double liaison et centre stéréogène</text>
<!-- alkene -->
<line x1="350" y1="300" x2="520" y2="300" class="db"/>
<line x1="350" y1="320" x2="520" y2="320" class="db"/>
<line x1="350" y1="310" x2="230" y2="190" class="bond"/>
<line x1="350" y1="310" x2="230" y2="430" class="bond"/>
<line x1="520" y1="310" x2="640" y2="190" class="bond"/>
<line x1="520" y1="310" x2="680" y2="430" class="bond"/>
<text x="165" y="180" class="txt">Cl</text>
<text x="185" y="470" class="txt">H</text>
<text x="640" y="175" class="txt">CH3</text>
<!-- chiral centre -->
<circle cx="680" cy="430" r="7" fill="#111"/>
<line x1="680" y1="430" x2="610" y2="600" class="bond"/>
<polygon points="680,430 860,430 830,460" class="wedge"/>
<line x1="680" y1="430" x2="825" y2="275" class="dash"/>
<text x="545" y="645" class="txt">CH3</text>
<text x="870" y="450" class="txt">OH</text>
<text x="835" y="275" class="txt">H</text>
<text x="664" y="414" class="star">*</text>

</svg>