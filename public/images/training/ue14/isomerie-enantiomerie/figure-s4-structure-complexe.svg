<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .db { stroke:#111; stroke-width:5; stroke-linecap:round; }
    .dash { stroke:#111; stroke-width:3; stroke-dasharray:8 8; fill:none; }
    .wedge { fill:#111; stroke:none; }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 25px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .star { font: bold 28px Arial, Helvetica, sans-serif; fill:#c20; }
    .card { fill:#fff; stroke:#111; stroke-width:3; }
  </style>
  
<text x="60" y="60" class="title">Figure S4 — Deux centres asymétriques et une double liaison</text>
<!-- chain COOH-C2-C3-C4=C5 -->
<text x="55" y="390" class="txt">HOOC</text>
<line x1="155" y1="380" x2="300" y2="380" class="bond"/>
<line x1="300" y1="380" x2="500" y2="380" class="bond"/>
<line x1="500" y1="380" x2="700" y2="300" class="bond"/>
<line x1="700" y1="290" x2="870" y2="290" class="db"/>
<line x1="700" y1="310" x2="870" y2="310" class="db"/>
<!-- C2 -->
<circle cx="300" cy="380" r="7" fill="#111"/>
<polygon points="300,380 300,185 330,225" class="wedge"/>
<line x1="300" y1="380" x2="300" y2="565" class="dash"/>
<text x="270" y="165" class="txt">Cl</text>
<text x="285" y="610" class="txt">H</text>
<text x="282" y="365" class="star">*</text>
<text x="270" y="430" class="small">C2</text>
<!-- C3 -->
<circle cx="500" cy="380" r="7" fill="#111"/>
<polygon points="500,380 500,565 530,525" class="wedge"/>
<line x1="500" y1="380" x2="500" y2="185" class="dash"/>
<text x="475" y="610" class="txt">OH</text>
<text x="485" y="165" class="txt">H</text>
<text x="482" y="365" class="star">*</text>
<text x="470" y="430" class="small">C3</text>
<!-- alkene substituents -->
<line x1="700" y1="300" x2="670" y2="455" class="bond"/>
<text x="625" y="500" class="txt">H</text>
<line x1="870" y1="300" x2="990" y2="170" class="bond"/>
<line x1="870" y1="300" x2="990" y2="430" class="bond"/>
<text x="1000" y="165" class="txt">Br</text>
<text x="1000" y="455" class="txt">H</text>
<text x="690" y="260" class="small">C4</text>
<text x="850" y="260" class="small">C5</text>

</svg>