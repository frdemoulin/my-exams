<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect x="0" y="0" width="1200" height="700" fill="white"/>
  <style>
    .bond { stroke:#111; stroke-width:5; stroke-linecap:round; fill:none; }
    .db1 { stroke:#111; stroke-width:5; stroke-linecap:round; }
    .db2 { stroke:#111; stroke-width:5; stroke-linecap:round; }
    .txt { font: 34px Arial, Helvetica, sans-serif; fill:#111; }
    .small { font: 28px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font: bold 30px Arial, Helvetica, sans-serif; fill:#111; }
    .title { font: bold 38px Arial, Helvetica, sans-serif; fill:#111; }
    .star { font: bold 28px Arial, Helvetica, sans-serif; fill:#c20; }
    .thin { stroke:#333; stroke-width:2; }
    .dash { stroke:#111; stroke-width:3; stroke-dasharray:8 8; fill:none; }
    .wedge { fill:#111; stroke:none; }
  </style>
  
<text x="70" y="60" class="title">Figure C4 — Molécule à deux centres asymétriques</text>
<line x1="120" y1="350" x2="270" y2="350" class="bond"/>
<line x1="270" y1="350" x2="430" y2="350" class="bond"/>
<line x1="430" y1="350" x2="590" y2="350" class="bond"/>
<text x="40" y="362" class="txt">COOH</text>
<text x="605" y="362" class="txt">CH3</text>

<!-- center 1 attachments -->
<line x1="270" y1="350" x2="270" y2="240" class="bond"/>
<polygon points="270,350 225,430 245,438" class="wedge"/>
<text x="248" y="225" class="txt">OH</text>
<text x="175" y="468" class="txt">H</text>
<text x="252" y="335" class="star">*</text>

<!-- center 2 attachments -->
<line x1="430" y1="350" x2="430" y2="240" class="bond"/>
<polygon points="430,350 475,430 455,438" class="wedge"/>
<text x="414" y="225" class="txt">Cl</text>
<text x="465" y="468" class="txt">H</text>
<text x="412" y="335" class="star">*</text>

</svg>