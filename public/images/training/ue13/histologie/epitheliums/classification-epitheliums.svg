<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="100%" height="100%" fill="white"/>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
.label { font-size: 34px; font-weight: 700; }
.small { font-size: 22px; }
.line { stroke:#111; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.thin { stroke:#111; stroke-width:3; fill:none; }
.cell { fill:#f7f7f7; stroke:#111; stroke-width:4; }
.nucleus { fill:#ddd; stroke:#111; stroke-width:3; }
</style>

<text x="85" y="55" class="label">A</text><text x="285" y="55" class="label">B</text><text x="485" y="55" class="label">C</text><text x="685" y="55" class="label">D</text><text x="885" y="55" class="label">E</text><text x="1080" y="55" class="label">F</text>
<line x1="35" y1="620" x2="1165" y2="620" class="line"/>
<!-- A simple squamous -->
<rect x="35" y="500" width="160" height="60" class="cell"/><ellipse cx="115" cy="530" rx="28" ry="18" class="nucleus"/>
<!-- B cuboidal -->
<rect x="235" y="430" width="160" height="130" class="cell"/><ellipse cx="315" cy="495" rx="28" ry="32" class="nucleus"/>
<!-- C columnar -->
<rect x="435" y="320" width="160" height="240" class="cell"/><ellipse cx="515" cy="475" rx="28" ry="42" class="nucleus"/>
<!-- D pseudostratified -->
<rect x="635" y="290" width="160" height="270" class="cell"/><ellipse cx="675" cy="470" rx="22" ry="30" class="nucleus"/><ellipse cx="730" cy="395" rx="22" ry="30" class="nucleus"/><ellipse cx="770" cy="500" rx="22" ry="30" class="nucleus"/>
<!-- E stratified squamous -->
<rect x="835" y="480" width="160" height="80" class="cell"/><rect x="835" y="400" width="160" height="80" class="cell"/><rect x="835" y="340" width="160" height="60" class="cell"/><ellipse cx="875" cy="520" rx="18" ry="22" class="nucleus"/><ellipse cx="950" cy="440" rx="18" ry="22" class="nucleus"/><ellipse cx="900" cy="370" rx="28" ry="12" class="nucleus"/>
<!-- F transition -->
<rect x="1035" y="470" width="130" height="90" class="cell"/><rect x="1035" y="390" width="130" height="80" class="cell"/><path d="M1035 390 Q1100 300 1165 390 L1165 425 L1035 425 Z" class="cell"/><ellipse cx="1100" cy="365" rx="30" ry="22" class="nucleus"/>

</svg>