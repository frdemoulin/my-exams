<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="100%" height="100%" fill="white"/>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
.label { font-size: 34px; font-weight: 700; }
.small { font-size: 22px; }
.line { stroke:#111; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.thin { stroke:#111; stroke-width:3; fill:none; }
.cell { fill:#f7f7f7; stroke:#111; stroke-width:4; }
.nucleus { fill:#ddd; stroke:#111; stroke-width:3; }
</style>

<text x="260" y="55" class="label">A</text><text x="860" y="55" class="label">B</text>
<!-- oligodendrocyte -->
<circle cx="300" cy="340" r="70" class="cell"/><ellipse cx="300" cy="340" rx="30" ry="38" class="nucleus"/>
<line x1="360" y1="300" x2="520" y2="180" class="line"/><line x1="370" y1="340" x2="540" y2="340" class="line"/><line x1="355" y1="385" x2="510" y2="500" class="line"/>
<line x1="470" y1="160" x2="650" y2="160" class="line"/><line x1="490" y1="340" x2="670" y2="340" class="line"/><line x1="460" y1="520" x2="640" y2="520" class="line"/>
<rect x="515" y="125" width="90" height="70" rx="30" fill="#ddd" stroke="#111" stroke-width="4"/><rect x="535" y="305" width="90" height="70" rx="30" fill="#ddd" stroke="#111" stroke-width="4"/><rect x="505" y="485" width="90" height="70" rx="30" fill="#ddd" stroke="#111" stroke-width="4"/>
<!-- Schwann -->
<line x1="760" y1="340" x2="1130" y2="340" class="line"/>
<rect x="850" y="270" width="190" height="140" rx="65" fill="#ddd" stroke="#111" stroke-width="5"/><ellipse cx="945" cy="340" rx="35" ry="45" class="nucleus"/>

</svg>