<path d="M455 260 L600 180 L760 270 L650 390 L500 470 Z" class="cell"/>
<path d="M600 180 L620 120 M760 270 L820 235 M500 470 L455 530" class="line"/>
<ellipse cx="610" cy="320" rx="30" ry="42" class="nucleus"/>
<line x1="535" y1="230" x2="720" y2="405" class="thin"/><line x1="565" y1="205" x2="745" y2="365" class="thin"/>
